---
# ======================
# NetworkPolicy — allow only OpenWebUI (namespace: ollama) + health probes
# and allow the OpenAPI bridge pods to reach MCP servers
# ======================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-allow-openwebui-and-probes
  namespace: mcp
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["mcp-server-ro","mcp-server-admin"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ollama
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["mcp-openapi-ro","mcp-openapi-admin"]
      ports:
        - protocol: TCP
          port: 8080
    # Kubelet/node probes (tighten to your node CIDRs)
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8080
---
# ======================
# NetworkPolicy — OpenWebUI and kubelet/node may reach the OpenAPI bridges
# ======================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-openapi-allow-openwebui
  namespace: mcp
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["mcp-openapi-ro","mcp-openapi-admin"]
  policyTypes: ["Ingress"]
  ingress:
    # OpenWebUI namespace (ollama)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ollama
      ports:
        - protocol: TCP
          port: 8080
    # Kubelet/node probes (REPLACE with your node subnet(s) once verified)
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8080
