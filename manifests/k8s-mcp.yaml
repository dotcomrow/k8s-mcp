apiVersion: v1
kind: Namespace
metadata:
  name: k8s-mcp-service
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=srvr-node"
    config.linkerd.io/opaque-ports: "5433,8200,443"
---
# ======================
# Service Accounts
# ======================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-ro
  namespace: k8s-mcp-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-admin
  namespace: k8s-mcp-service
---
# ======================
# RBAC
# ======================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-readonly
rules:
  - apiGroups: [""]
    resources: ["pods","pods/log","services","endpoints","configmaps","events","namespaces","nodes"]
    verbs: ["get","list","watch"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets","daemonsets","replicasets"]
    verbs: ["get","list","watch"]
  - apiGroups: ["batch"]
    resources: ["jobs","cronjobs"]
    verbs: ["get","list","watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get","list","watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses","networkpolicies"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-admin
rules:
  - apiGroups: [""]
    resources: ["pods","pods/log","services","endpoints","configmaps","secrets","events","namespaces","nodes","persistentvolumeclaims"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets","daemonsets","replicasets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs","cronjobs"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles","rolebindings","clusterroles","clusterrolebindings"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses","networkpolicies"]
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-readonly
subjects:
  - kind: ServiceAccount
    name: mcp-server-ro
    namespace: k8s-mcp-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-admin
subjects:
  - kind: ServiceAccount
    name: mcp-server-admin
    namespace: k8s-mcp-service
---
# ======================
# Driver Configs (per-deployment) — wave 0
# ======================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-openapi-ro-driver-config
  namespace: k8s-mcp-service
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  driver-manifest.yaml: |
    apiVersion: mcp.openapi/v1alpha1
    kind: DriverManifest
    metadata:
      name: yugabyte
    spec:
      drivers:
        - name: yugabyte
          config:
            redis:
              url: redis://redis.redis.svc.cluster.local:6379/0
              namespace: k8s-mcp-service:mcp-openapi-ro
              key_prefix: mcp
              ttl_seconds: 60
            yugabyte:
              host: yb-tserver-service.yugabyte.svc.cluster.local
              port: 5433
              database: mcp
              schema: mcp_openapi_ro
              sslmode: disable
              usernameFile: /vault/secrets/yb-username
              passwordFile: /vault/secrets/yb-password
              role: mcp_group_app
              pool:
                min_size: 1
                max_size: 8
            bootstrap:
              create_schema: true
              run_migrations: true
            sync:
              enabled: true
              interval_seconds: 15
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-openapi-admin-driver-config
  namespace: k8s-mcp-service
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  driver-manifest.yaml: |
    apiVersion: mcp.openapi/v1alpha1
    kind: DriverManifest
    metadata:
      name: yugabyte
    spec:
      drivers:
        - name: yugabyte
          config:
            redis:
              url: redis://redis.redis.svc.cluster.local:6379/0
              namespace: k8s-mcp-service:mcp-openapi-admin
              key_prefix: mcp
              ttl_seconds: 60
            yugabyte:
              host: yb-tserver-service.yugabyte.svc.cluster.local
              port: 5433
              database: mcp
              schema: mcp_openapi_admin
              sslmode: disable
              usernameFile: /vault/secrets/yb-username
              passwordFile: /vault/secrets/yb-password
              role: mcp_group_app
              pool:
                min_size: 1
                max_size: 8
            bootstrap:
              create_schema: true
              run_migrations: true
            sync:
              enabled: true
              interval_seconds: 10
---
# =================================================================
# Init: Vault + Yugabyte setup (unified app role/policy; full RW) — wave 0
# =================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: mcp-yugabyte-config
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-mcp
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu

              PGHOST="yb-tserver-service.yugabyte.svc.cluster.local"
              PGPORT="5433"
              ADMIN_DB="yugabyte"
              APP_DB="mcp"
              VAULTADMIN_USER="vaultadmin"
              VAULTADMIN_KV_PATH="secret/vaultadmin"

              ROLE_GROUP_RO="mcp_group_ro"
              ROLE_GROUP_ADMIN="mcp_group_admin"
              ROLE_GROUP_APP="mcp_group_app"
              SCHEMA_RO="mcp_openapi_ro"
              SCHEMA_ADMIN="mcp_openapi_admin"

              VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              AUTH_PATH="kubernetes"

              DB_MOUNT="yugabyte-db"
              DB_NAME_IN_VAULT="yugabyte"
              VAULT_ROLE_RO="mcp-yb-ro"
              VAULT_ROLE_ADMIN="mcp-yb-admin"
              VAULT_ROLE_APP="mcp-yb-app"

              # OPTIONAL: superuser takeover KV (contains at least {password}; {username} optional, defaults to yugabyte)
              YSQL_SU_KV_PATH="${YSQL_SU_KV_PATH:-secret/yugabyte-su}"

              SA_NS="k8s-mcp-service"
              SA_RO="mcp-server-ro"
              SA_ADMIN="mcp-server-admin"

              apk add --no-cache postgresql15-client jq curl netcat-openbsd >/dev/null || true

              export PATH="$PATH:/vault-bin"
              export VAULT_ADDR

              until [ -s /vault-token/VAULT_TOKEN ]; do echo "🔁 waiting for /vault-token/VAULT_TOKEN..."; sleep 2; done
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              echo "🔐 Fetching ${VAULTADMIN_KV_PATH}..."
              VAULTADMIN_PASS="$(vault kv get -format=json "${VAULTADMIN_KV_PATH}" | jq -r '.data.data.password // .data.data.value')"

              until getent hosts "$PGHOST" >/dev/null 2>&1; do echo "🔄 waiting for DNS $PGHOST..."; sleep 3; done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do echo "⏳ waiting for DB $PGHOST:$PGPORT..."; sleep 3; done
              echo "✅ Yugabyte reachable"

              export PGPASSWORD="$VAULTADMIN_PASS"

              DB_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$ADMIN_DB" -tAc "SELECT 1 FROM pg_database WHERE datname='${APP_DB}'" || true)"
              if [ "$DB_EXISTS" != "1" ]; then
                echo "📦 Creating DB '${APP_DB}' owned by ${VAULTADMIN_USER}…"
                createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$APP_DB"
              else
                echo "✅ DB '${APP_DB}' exists"
              fi

              ensure_role () {
                role="$1"
                exists="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -tAc "SELECT 1 FROM pg_roles WHERE rolname='${role}'" || true)"
                if [ "$exists" != "1" ]; then
                  echo "➕ Creating role ${role}"
                  psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 -c "CREATE ROLE ${role} NOLOGIN;"
                else
                  echo "✅ Role ${role} exists"
                fi
              }
              ensure_role "${ROLE_GROUP_RO}"
              ensure_role "${ROLE_GROUP_ADMIN}"
              ensure_role "${ROLE_GROUP_APP}"

              # Let vaultadmin manage default privs FOR ROLE ...
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 -c \
                "GRANT ${ROLE_GROUP_RO}, ${ROLE_GROUP_ADMIN}, ${ROLE_GROUP_APP} TO ${VAULTADMIN_USER};"

              # --- SAFE: DB & schema level (fail-fast)
              cat >/tmp/mcp_safe.sql <<'SQL'
              GRANT ALL PRIVILEGES ON DATABASE mcp TO vaultadmin;
              GRANT ALL PRIVILEGES ON DATABASE mcp TO mcp_group_admin;
              GRANT ALL PRIVILEGES ON DATABASE mcp TO mcp_group_app;
              GRANT CONNECT ON DATABASE mcp TO mcp_group_ro;

              CREATE SCHEMA IF NOT EXISTS mcp_openapi_ro    AUTHORIZATION vaultadmin;
              CREATE SCHEMA IF NOT EXISTS mcp_openapi_admin AUTHORIZATION vaultadmin;

              GRANT USAGE, CREATE ON SCHEMA mcp_openapi_ro    TO mcp_group_admin, mcp_group_app, vaultadmin;
              GRANT USAGE, CREATE ON SCHEMA mcp_openapi_admin TO mcp_group_admin, mcp_group_app, vaultadmin;

              GRANT USAGE ON SCHEMA mcp_openapi_ro    TO mcp_group_ro;
              GRANT USAGE ON SCHEMA mcp_openapi_admin TO mcp_group_ro;
              SQL
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 -f /tmp/mcp_safe.sql
              echo "✅ DB & schema-level grants applied"

              # --- BEST-EFFORT: existing objects (will fail if not owner; OK)
              cat >/tmp/mcp_best_effort.sql <<'SQL'
              GRANT ALL PRIVILEGES ON ALL TABLES    IN SCHEMA mcp_openapi_ro    TO vaultadmin;
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA mcp_openapi_ro    TO vaultadmin;
              GRANT ALL PRIVILEGES ON ALL TABLES    IN SCHEMA mcp_openapi_admin TO vaultadmin;
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA mcp_openapi_admin TO vaultadmin;

              GRANT SELECT ON ALL TABLES    IN SCHEMA mcp_openapi_ro    TO mcp_group_ro;
              GRANT SELECT ON ALL SEQUENCES IN SCHEMA mcp_openapi_ro    TO mcp_group_ro;
              GRANT SELECT ON ALL TABLES    IN SCHEMA mcp_openapi_admin TO mcp_group_ro;
              GRANT SELECT ON ALL SEQUENCES IN SCHEMA mcp_openapi_admin TO mcp_group_ro;

              GRANT ALL PRIVILEGES ON ALL TABLES    IN SCHEMA mcp_openapi_ro    TO mcp_group_admin, mcp_group_app;
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA mcp_openapi_ro    TO mcp_group_admin, mcp_group_app;
              GRANT ALL PRIVILEGES ON ALL TABLES    IN SCHEMA mcp_openapi_admin TO mcp_group_admin, mcp_group_app;
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA mcp_openapi_admin TO mcp_group_admin, mcp_group_app;
              SQL
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=0 -f /tmp/mcp_best_effort.sql || true

              # --- DEFAULT PRIVS for future objects (works now that vaultadmin is a member)
              cat >/tmp/mcp_default_privs.sql <<'SQL'
              ALTER DEFAULT PRIVILEGES FOR ROLE mcp_group_app IN SCHEMA mcp_openapi_ro
                GRANT ALL PRIVILEGES ON TABLES TO vaultadmin;
              ALTER DEFAULT PRIVILEGES FOR ROLE mcp_group_app IN SCHEMA mcp_openapi_admin
                GRANT ALL PRIVILEGES ON TABLES TO vaultadmin;
              ALTER DEFAULT PRIVILEGES FOR ROLE mcp_group_app IN SCHEMA mcp_openapi_ro
                GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO vaultadmin;
              ALTER DEFAULT PRIVILEGES FOR ROLE mcp_group_app IN SCHEMA mcp_openapi_admin
                GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO vaultadmin;
              SQL
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 -f /tmp/mcp_default_privs.sql

              echo "ℹ️ Current owners of migrations tables:"
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=0 -c \
                "SELECT schemaname, tablename, tableowner
                   FROM pg_catalog.pg_tables
                  WHERE schemaname IN ('mcp_openapi_ro','mcp_openapi_admin')
                    AND tablename IN ('mcp_migrations');" || true

              # --- OPTIONAL: Superuser takeover (if KV exists)
              if vault kv get -format=json "${YSQL_SU_KV_PATH}" >/dev/null 2>&1; then
                echo "🔧 Superuser takeover enabled via ${YSQL_SU_KV_PATH}"
                SU_USER="$(vault kv get -format=json "${YSQL_SU_KV_PATH}" | jq -r '.data.data.username // "yugabyte"')"
                SU_PASS="$(vault kv get -format=json "${YSQL_SU_KV_PATH}" | jq -r '.data.data.password')"
                export PGPASSWORD="$SU_PASS"

                cat >/tmp/mcp_takeover.sql <<'SQL'
                DO $$
                DECLARE r record;
                BEGIN
                  FOR r IN
                    SELECT format('%I.%I', schemaname, tablename) AS rel
                    FROM pg_catalog.pg_tables
                    WHERE schemaname IN ('mcp_openapi_ro','mcp_openapi_admin')
                  LOOP
                    EXECUTE format('ALTER TABLE %s OWNER TO %I', r.rel, 'vaultadmin');
                  END LOOP;

                  FOR r IN
                    SELECT format('%I.%I', sequence_schema, sequence_name) AS rel
                    FROM information_schema.sequences
                    WHERE sequence_schema IN ('mcp_openapi_ro','mcp_openapi_admin')
                  LOOP
                    EXECUTE format('ALTER SEQUENCE %s OWNER TO %I', r.rel, 'vaultadmin');
                  END LOOP;
                END$$;
                SQL
                psql -h "$PGHOST" -p "$PGPORT" -U "$SU_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 -f /tmp/mcp_takeover.sql
                echo "✅ Ownership in mcp_openapi_ro & mcp_openapi_admin set to vaultadmin"

                # Re-apply grants cleanly as vaultadmin
                export PGPASSWORD="$VAULTADMIN_PASS"
                psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 -f /tmp/mcp_best_effort.sql
              else
                echo "ℹ️ Superuser KV not found; skipping ownership takeover."
              fi

              # --- Vault DB engine & roles
              if ! vault secrets list -format=json | jq -e 'has("'"${DB_MOUNT}"'/")' >/dev/null 2>&1; then
                vault secrets enable -path="${DB_MOUNT}" database
              fi

              vault write "${DB_MOUNT}/roles/${VAULT_ROLE_RO}" \
                db_name="${DB_NAME_IN_VAULT}" \
                default_ttl="1h" \
                max_ttl="24h" \
                creation_statements=$'CREATE ROLE "{{name}}" WITH LOGIN PASSWORD \'{{password}}\' VALID UNTIL \'{{expiration}}\';\nGRANT '"${ROLE_GROUP_RO}"' TO "{{name}}";\nALTER DEFAULT PRIVILEGES FOR USER "{{name}}" IN SCHEMA '"${SCHEMA_RO}"'    GRANT ALL PRIVILEGES ON TABLES TO '"${VAULTADMIN_USER}"';\nALTER DEFAULT PRIVILEGES FOR USER "{{name}}" IN SCHEMA '"${SCHEMA_ADMIN}"' GRANT ALL PRIVILEGES ON TABLES TO '"${VAULTADMIN_USER}"';\nALTER DEFAULT PRIVILEGES FOR USER "{{name}}" IN SCHEMA '"${SCHEMA_RO}"'    GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO '"${VAULTADMIN_USER}"';\nALTER DEFAULT PRIVILEGES FOR USER "{{name}}" IN SCHEMA '"${SCHEMA_ADMIN}"' GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO '"${VAULTADMIN_USER}"';'

              vault write "${DB_MOUNT}/roles/${VAULT_ROLE_ADMIN}" \
                db_name="${DB_NAME_IN_VAULT}" \
                default_ttl="1h" \
                max_ttl="24h" \
                creation_statements=$'CREATE ROLE "{{name}}" WITH LOGIN PASSWORD \'{{password}}\' VALID UNTIL \'{{expiration}}\';\nGRANT '"${ROLE_GROUP_ADMIN}"' TO "{{name}}";\nALTER DEFAULT PRIVILEGES FOR USER "{{name}}" IN SCHEMA '"${SCHEMA_RO}"'    GRANT ALL PRIVILEGES ON TABLES TO '"${VAULTADMIN_USER}"';\nALTER DEFAULT PRIVILEGES FOR USER "{{name}}" IN SCHEMA '"${SCHEMA_ADMIN}"' GRANT ALL PRIVILEGES ON TABLES TO '"${VAULTADMIN_USER}"';\nALTER DEFAULT PRIVILEGES FOR USER "{{name}}" IN SCHEMA '"${SCHEMA_RO}"'    GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO '"${VAULTADMIN_USER}"';\nALTER DEFAULT PRIVILEGES FOR USER "{{name}}" IN SCHEMA '"${SCHEMA_ADMIN}"' GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO '"${VAULTADMIN_USER}"';'

              vault write "${DB_MOUNT}/roles/${VAULT_ROLE_APP}" \
                db_name="${DB_NAME_IN_VAULT}" \
                default_ttl="1h" \
                max_ttl="24h" \
                creation_statements=$'CREATE ROLE "{{name}}" WITH LOGIN PASSWORD \'{{password}}\' VALID UNTIL \'{{expiration}}\';\nGRANT '"${ROLE_GROUP_APP}"' TO "{{name}}";\nALTER DEFAULT PRIVILEGES FOR USER "{{name}}" IN SCHEMA '"${SCHEMA_RO}"'    GRANT ALL PRIVILEGES ON TABLES TO '"${VAULTADMIN_USER}"';\nALTER DEFAULT PRIVILEGES FOR USER "{{name}}" IN SCHEMA '"${SCHEMA_ADMIN}"' GRANT ALL PRIVILEGES ON TABLES TO '"${VAULTADMIN_USER}"';\nALTER DEFAULT PRIVILEGES FOR USER "{{name}}" IN SCHEMA '"${SCHEMA_RO}"'    GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO '"${VAULTADMIN_USER}"';\nALTER DEFAULT PRIVILEGES FOR USER "{{name}}" IN SCHEMA '"${SCHEMA_ADMIN}"' GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO '"${VAULTADMIN_USER}"';'

              vault policy write "${VAULT_ROLE_RO}" - <<EOF
              path "${DB_MOUNT}/creds/${VAULT_ROLE_RO}" { capabilities = ["read"] }
              EOF
              vault policy write "${VAULT_ROLE_ADMIN}" - <<EOF
              path "${DB_MOUNT}/creds/${VAULT_ROLE_ADMIN}" { capabilities = ["read"] }
              EOF
              vault policy write "${VAULT_ROLE_APP}" - <<EOF
              path "${DB_MOUNT}/creds/${VAULT_ROLE_APP}" { capabilities = ["read"] }
              EOF

              vault write auth/${AUTH_PATH}/role/${VAULT_ROLE_RO} \
                bound_service_account_names="${SA_RO}" \
                bound_service_account_namespaces="${SA_NS}" \
                policies="${VAULT_ROLE_RO}" \
                ttl="24h"

              vault write auth/${AUTH_PATH}/role/${VAULT_ROLE_ADMIN} \
                bound_service_account_names="${SA_ADMIN}" \
                bound_service_account_namespaces="${SA_NS}" \
                policies="${VAULT_ROLE_ADMIN}" \
                ttl="24h"

              vault write auth/${AUTH_PATH}/role/${VAULT_ROLE_APP} \
                bound_service_account_names="${SA_RO},${SA_ADMIN}" \
                bound_service_account_namespaces="${SA_NS}" \
                policies="${VAULT_ROLE_APP}" \
                ttl="24h"

              echo "🎉 Setup complete."
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
---
# =================================================================
# === OpenAPI bridge (stdio sidecar) — READ-ONLY INSTANCE — wave 1
# =================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-openapi-ro
  namespace: k8s-mcp-service
  labels: { app: mcp-openapi-ro }
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-openapi-ro }
  template:
    metadata:
      labels: { app: mcp-openapi-ro }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "mcp-yb-app"
        vault.hashicorp.com/auth-path: "auth/kubernetes"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-yb-username: "yugabyte-db/creds/mcp-yb-app"
        vault.hashicorp.com/agent-inject-template-yb-username: |
          {{- with secret "yugabyte-db/creds/mcp-yb-app" -}}{{ .Data.username }}{{- end }}
        vault.hashicorp.com/agent-inject-secret-yb-password: "yugabyte-db/creds/mcp-yb-app"
        vault.hashicorp.com/agent-inject-template-yb-password: |
          {{- with secret "yugabyte-db/creds/mcp-yb-app" -}}{{ .Data.password }}{{- end }}
        vault.hashicorp.com/secret-volume-path: "/vault/secrets"
    spec:
      serviceAccountName: mcp-server-ro
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      volumes:
        - name: kube
          emptyDir: {}
        - name: mcpbin
          emptyDir: {}
        - name: driver-config
          configMap:
            name: mcp-openapi-ro-driver-config
            items:
              - key: driver-manifest.yaml
                path: driver-manifest.yaml
      initContainers:
        - name: write-kubeconfig
          image: alpine:3.20
          securityContext: { runAsUser: 0, runAsNonRoot: false }
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              cat > /kube/config <<EOF
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  server: ${API}
                name: in
              contexts:
              - context:
                  cluster: in
                  namespace: ${NS}
                  user: sa
                name: in
              current-context: in
              users:
              - name: sa
                user:
                  token: ${TOKEN}
              EOF
          volumeMounts:
            - name: kube
              mountPath: /kube
        - name: fetch-mcp-binary
          image: ghcr.io/azure/mcp-kubernetes:latest
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              for p in /usr/local/bin/mcp-kubernetes /app/mcp-kubernetes /mcp-kubernetes; do
                if [ -x "$p" ]; then cp "$p" /mcpbin/mcp-kubernetes && chmod +x /mcpbin/mcp-kubernetes && exit 0; fi
              done
              echo "mcp-kubernetes binary not found in image" >&2; exit 1
          volumeMounts:
            - name: mcpbin
              mountPath: /mcpbin
        - name: install-kubectl
          image: bitnami/kubectl:1.29
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
