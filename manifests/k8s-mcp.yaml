---
# ======================
# NetworkPolicy — OpenWebUI and kubelet/node may reach the OpenAPI bridges
# ======================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-openapi-allow-openwebui
  namespace: k8s-mcp-service
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["mcp-openapi-ro","mcp-openapi-admin"]
  policyTypes: ["Ingress"]
  ingress:
    # OpenWebUI namespace (ollama)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ollama
      ports:
        - protocol: TCP
          port: 8080
    # Kubelet/node probes (tighten to your node CIDRs when ready)
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8080
