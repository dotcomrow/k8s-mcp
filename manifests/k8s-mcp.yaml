            - name: mcpbin
              mountPath: /mcpbin
        - name: db-ready-check
          image: alpine:3.20
          env:
            - name: DB_HOST
              value: "yb-tserver-service.yugabyte.svc.cluster.local"
            - name: DB_PORT
              value: "5433"
            - name: DB_NAME
              value: "mcp"
            - name: DB_SCHEMA
              value: "mcp_openapi_ro"
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              apk add --no-cache postgresql15-client netcat-openbsd >/dev/null
              until [ -s /vault/secrets/yb-username ] && [ -s /vault/secrets/yb-password ]; do
