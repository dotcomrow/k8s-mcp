                   psql -tAc "SELECT has_schema_privilege(current_user, '${DB_SCHEMA}', 'USAGE')" | grep -q t &&
                   psql -tAc "SELECT has_schema_privilege(current_user, '${DB_SCHEMA}', 'CREATE')" | grep -q t
                then
                  echo "✅ DB & privileges ready"; exit 0
                fi
