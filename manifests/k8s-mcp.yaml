              if [ -x "$SRC" ]; then
                cp "$SRC" /mcpbin/kubectl && chmod +x /mcpbin/kubectl
              elif command -v kubectl >/dev/null 2>&1; then
                cp "$(command -v kubectl)" /mcpbin/kubectl && chmod +x /mcpbin/kubectl
              else
                echo "kubectl not found in bitnami image" >&2; exit 1
              fi
