            # Optional extras:
            # - --additional-tools=helm
            # - --allow-namespaces=default,openwebui,mcp
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
