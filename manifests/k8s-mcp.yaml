apiVersion: v1
kind: Namespace
metadata:
  name: mcp
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=srvr-node"
    config.linkerd.io/opaque-ports: "5433,8200,443"
---
# ======================
# Service Accounts
# ======================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-ro
  namespace: mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-admin
  namespace: mcp
---
# ======================
# RBAC
# ======================
# Read-only cluster role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-readonly
rules:
  - apiGroups: [""]
    resources: ["pods","pods/log","services","endpoints","configmaps","events","namespaces","nodes"]
    verbs: ["get","list","watch"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets","daemonsets","replicasets"]
    verbs: ["get","list","watch"]
  - apiGroups: ["batch"]
    resources: ["jobs","cronjobs"]
    verbs: ["get","list","watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get","list","watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses","networkpolicies"]
    verbs: ["get","list","watch"]
---
# Admin (broad) role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-admin
rules:
  - apiGroups: [""]
    resources: ["pods","pods/log","services","endpoints","configmaps","secrets","events","namespaces","nodes","persistentvolumeclaims"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets","daemonsets","replicasets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs","cronjobs"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles","rolebindings","clusterroles","clusterrolebindings"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses","networkpolicies"]
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]
---
# Bindings
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-readonly
subjects:
  - kind: ServiceAccount
    name: mcp-server-ro
    namespace: mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-admin
subjects:
  - kind: ServiceAccount
    name: mcp-server-admin
    namespace: mcp
---
# ======================
# MCP SERVER (READ-ONLY) — HTTP/SSE
# ======================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server-ro
  namespace: mcp
  labels:
    app: mcp-server-ro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server-ro
  template:
    metadata:
      labels:
        app: mcp-server-ro
    spec:
      serviceAccountName: mcp-server-ro
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 10
      volumes:
        - name: kube
          emptyDir: {}
      initContainers:
        - name: write-kubeconfig
          image: alpine:3.20
          securityContext: { runAsUser: 0, runAsNonRoot: false }
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              cat > /kube/config <<EOF
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  server: ${API}
                name: in
              contexts:
              - context:
                  cluster: in
                  namespace: ${NS}
                  user: sa
                name: in
              current-context: in
              users:
              - name: sa
                user:
                  token: ${TOKEN}
              EOF
          volumeMounts:
            - name: kube
              mountPath: /kube
      containers:
        - name: mcp
          image: ghcr.io/azure/mcp-kubernetes:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KUBECONFIG
              value: /kube/config
          args:
            - --transport=streamable-http
            - --host=0.0.0.0
            - --port=8080
            - --access-level=readonly
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - name: kube
              mountPath: /kube
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-ro
  namespace: mcp
  labels:
    app: mcp-server-ro
spec:
  type: ClusterIP
  selector:
    app: mcp-server-ro
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# ======================
# MCP SERVER (ADMIN) — HTTP/SSE
# ======================
