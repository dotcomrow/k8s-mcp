# ======================
# NetworkPolicy — allow only OpenWebUI + kubelet/node health probes
# (updated to also allow OpenAPI bridge pods to reach MCP servers)
# ======================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-allow-openwebui-and-probes
  namespace: mcp
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["mcp-server-ro","mcp-server-admin"]
  policyTypes: ["Ingress"]
  ingress:
    # 1) Allow calls from OpenWebUI namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openwebui
      ports:
        - protocol: TCP
          port: 8080
    # 2) Allow same-namespace OpenAPI bridge pods to call MCP servers
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["mcp-openapi-ro","mcp-openapi-admin"]
      ports:
        - protocol: TCP
          port: 8080
    # 3) Allow kubelet/node health probes (tighten this to your node CIDRs)
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0   # TODO: set to your node subnet(s), e.g. 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 8080

# ======================
# NetworkPolicy — only OpenWebUI may reach the OpenAPI bridges
# ======================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-openapi-allow-openwebui
  namespace: mcp
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["mcp-openapi-ro","mcp-openapi-admin"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openwebui
          podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
