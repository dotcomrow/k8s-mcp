---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-admin
  namespace: mcp
  labels:
    app: mcp-server-admin
spec:
  type: ClusterIP
  selector:
    app: mcp-server-admin
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# =================================================================
# === OpenAPI bridge (using your image) — RO
# =================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-openapi-ro
  namespace: mcp
  labels: { app: mcp-openapi-ro }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-openapi-ro }
  template:
    metadata:
      labels: { app: mcp-openapi-ro }
    spec:
      serviceAccountName: mcp-server-ro
      containers:
        - name: bridge
          image: ghcr.io/dotcomrow/mcp-openapi-tool-server-image:ts-20250913-154343
          imagePullPolicy: Always
          env:
            - name: MCP_RPC_URL
              value: "http://mcp-server-ro.mcp.svc.cluster.local:8080/mcp"
            - name: CORS_ALLOW_ORIGINS
              value: "*"
            - name: STARTUP_TIMEOUT
              value: "30"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-openapi-ro
