apiVersion: v1
kind: Namespace
metadata:
  name: mcp
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=srvr-node"
    config.linkerd.io/opaque-ports: "5433,8200,443"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server
  namespace: mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-controller
rules:
  - apiGroups: [""]
    resources: ["pods","pods/log","services","endpoints","configmaps","secrets","events","namespaces","nodes","persistentvolumeclaims"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets","daemonsets","replicasets"]
    verbs: ["get","list","watch","create","update","patch","delete","scale"]
  - apiGroups: ["batch"]
    resources: ["jobs","cronjobs"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles","rolebindings","clusterroles","clusterrolebindings"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses","networkpolicies"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get","list","watch","create","update","patch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-controller
subjects:
  - kind: ServiceAccount
    name: mcp-server
    namespace: mcp
---
# ========= External Secrets: SecretStore + ExternalSecrets =========
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: mcp
spec:
  provider:
    vault:
      server: https://vault.app.suncoast.systems
      # caBundle: <BASE64_CA>   # uncomment if Vault uses a private CA
      path: secret
      version: v2
      auth:
        kubernetes:
          serviceAccountRef:
            name: mcp-server
          role: mcp-external-secrets
          mountPath: kubernetes
          audience: vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: yb-vaultadmin
  namespace: mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: yb-vaultadmin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: vaultadmin
        property: username
    - secretKey: password
      remoteRef:
        key: vaultadmin
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-db-static
  namespace: mcp
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: mcp-db-static
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_HOST: "yb-tserver-service.yugabyte.svc.cluster.local"
        DB_PORT: "5433"
        DB_NAME: "mcp"
        DB_USERNAME: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
        DATABASE_URL: >-
          postgres://{{ .username }}:{{ .password }}@yb-tserver-service.yugabyte.svc.cluster.local:5433/mcp?sslmode=disable
  data:
    - secretKey: username
      remoteRef:
        key: yugabyte-db/static-creds/mcp-app
        property: username
    - secretKey: password
      remoteRef:
        key: yugabyte-db/static-creds/mcp-app
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-apis
  namespace: mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: mcp-apis
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: open_ai_key
        property: OPENAI_API_KEY
        optional: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-config
  namespace: mcp
data:
  MCP_SERVER_NAME: "mcp-k8s"
  MCP_LOG_LEVEL: "info"
---
# ========= Vault bootstrap helpers (run in vault ns) =========
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-mcp-vault-root-token
  namespace: vault
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-c"]
          args: |
            set -eu
            NS_SRC="vault"
            NS_DST="mcp"
            SRC_NAME="vault-root-token"
            DST_NAME="vault-root-token"
            if ! kubectl -n "${NS_SRC}" get secret "${SRC_NAME}" >/dev/null 2>&1; then
              echo "Source secret ${NS_SRC}/${SRC_NAME} not found"; exit 1
            fi
            kubectl -n "${NS_SRC}" get secret "${SRC_NAME}" -o json \
              | jq '.metadata.namespace="'"${NS_DST}"'"|.metadata.name="'"${DST_NAME}"'"|del(.metadata.uid,.metadata.resourceVersion,.metadata.creationTimestamp,.metadata.ownerReferences)' \
              | kubectl apply -f -
            echo "Copied."
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mcp-eso-vault-role
  namespace: vault
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-eso-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args: |
            set -eu
            export PATH="$PATH:/vault-bin"
            export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
            while [ ! -f /vault-token/VAULT_TOKEN ]; do sleep 2; done
            export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
            apk add --no-cache jq >/dev/null

            vault auth list -format=json | jq -e 'has("kubernetes/")' >/dev/null 2>&1 || vault auth enable kubernetes

            KUBE_HOST="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
            TOKEN_REVIEWER_JWT="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
            CA_FILE="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            # Must match SA token issuer you observed in your JWT
            ISSUER="https://kubernetes.default.svc.internal.lan"

            vault write auth/kubernetes/config \
              token_reviewer_jwt="$TOKEN_REVIEWER_JWT" \
              kubernetes_host="$KUBE_HOST" \
              kubernetes_ca_cert=@"$CA_FILE" \
              issuer="$ISSUER"

            vault policy write "mcp-external-secrets" - <<'EOF'
            path "secret/data/vaultadmin"                 { capabilities = ["read"] }
            path "yugabyte-db/static-creds/mcp-app"       { capabilities = ["read"] }
            path "secret/data/open_ai_key"                { capabilities = ["read"] }
            EOF

            vault write auth/kubernetes/role/mcp-external-secrets \
              bound_service_account_names="mcp-server" \
              bound_service_account_namespaces="mcp" \
              bound_audiences="vault" \
              policies="mcp-external-secrets" \
              ttl="24h"

            echo "Configured ESO role mcp-external-secrets."
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mcp-yugabyte-config
  namespace: vault
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args: |
            set -eu
            PGHOST="${PGHOST:-yb-tserver-service.yugabyte.svc.cluster.local}"
            PGPORT="${PGPORT:-5433}"
            DB="mcp"
            BASE_ROLE="mcp"
            OWNER_ROLE="mcp_app"
            VAULTADMIN_USER="vaultadmin"

            apk add --no-cache postgresql15-client jq netcat-openbsd curl
            export PATH="$PATH:/vault-bin"
            export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
            while [ ! -f /vault-token/VAULT_TOKEN ]; do sleep 2; done
            export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

            if ! vault secrets list -format=json | jq -e '."secret/".type=="kv" and ."secret/".options.version=="2"' >/dev/null 2>&1; then
              if vault secrets list -format=json | jq -e 'has("secret/")' >/dev/null 2>&1; then
                echo "'secret/' exists but is not KVv2; abort."; exit 1
              else
                vault secrets enable -path=secret -version=2 kv
              fi
            fi

            VAULTADMIN_PASS="$(vault kv get -format=json secret/${VAULTADMIN_USER} 2>/dev/null | jq -r '.data.data.password // .data.data.value // empty' || true)"
            if [ -z "${VAULTADMIN_PASS:-}" ] || [ "${VAULTADMIN_PASS}" = "null" ]; then
              echo "secret/${VAULTADMIN_USER} missing 'password'"; exit 1
            fi
            export PGPASSWORD="$VAULTADMIN_PASS"

            until getent hosts "$PGHOST" >/dev/null 2>&1; do sleep 3; done
            until nc -z -w1 "$PGHOST" "$PGPORT"; do sleep 3; done

            DB_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='${DB}'" || true)"
            if [ "${DB_EXISTS}" != "1" ]; then
              createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$DB"
            fi

            psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<EOSQL
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${BASE_ROLE}') THEN
                CREATE ROLE ${BASE_ROLE} NOLOGIN INHERIT;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${OWNER_ROLE}') THEN
                CREATE ROLE ${OWNER_ROLE} LOGIN INHERIT;
              END IF;
            END
            \$\$;

            CREATE SCHEMA IF NOT EXISTS mcp AUTHORIZATION ${VAULTADMIN_USER};
            ALTER ROLE ${OWNER_ROLE} SET search_path = mcp;

            GRANT USAGE, CREATE ON SCHEMA mcp TO ${BASE_ROLE};
            GRANT ${BASE_ROLE} TO ${OWNER_ROLE};
            GRANT CONNECT ON DATABASE ${DB} TO ${OWNER_ROLE};

            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES    IN SCHEMA mcp TO ${BASE_ROLE};
            GRANT USAGE, SELECT                     ON ALL SEQUENCES IN SCHEMA mcp TO ${BASE_ROLE};
            ALTER DEFAULT PRIVILEGES IN SCHEMA mcp GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES   TO ${BASE_ROLE};
            ALTER DEFAULT PRIVILEGES IN SCHEMA mcp GRANT USAGE, SELECT                ON SEQUENCES TO ${BASE_ROLE};

            GRANT ALL PRIVILEGES ON ALL TABLES    IN SCHEMA mcp TO ${VAULTADMIN_USER};
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA mcp TO ${VAULTADMIN_USER};
            ALTER DEFAULT PRIVILEGES IN SCHEMA mcp GRANT ALL ON TABLES    TO ${VAULTADMIN_USER};
            ALTER DEFAULT PRIVILEGES IN SCHEMA mcp GRANT ALL ON SEQUENCES TO ${VAULTADMIN_USER};
            EOSQL

            if ! vault secrets list -format=json | jq -e 'has("yugabyte-db/")' >/dev/null 2>&1; then
              vault secrets enable -path=yugabyte-db database
            fi

            vault write yugabyte-db/static-roles/mcp-app \
              db_name="yugabyte" \
              username="${OWNER_ROLE}" \
              rotation_statements="ALTER ROLE ${OWNER_ROLE} WITH PASSWORD '{{password}}';" \
              rotation_period="720h"

            vault policy write "mcp" - <<'EOF'
            path "yugabyte-db/static-creds/mcp-app" { capabilities = ["read"] }
            path "secret/data/vaultadmin"           { capabilities = ["read"] }
            path "secret/data/mcp/*"                { capabilities = ["read"] }
            EOF

            vault write auth/kubernetes/role/mcp \
              bound_service_account_names="mcp-server" \
              bound_service_account_namespaces="mcp" \
              bound_audiences="vault" \
              policies="mcp" \
              ttl="48h"

            CREDS_JSON="$(vault read -format=json yugabyte-db/static-creds/mcp-app)"
            APP_USER="$(printf '%s' "$CREDS_JSON" | jq -r .data.username)"
            APP_PASS="$(printf '%s' "$CREDS_JSON" | jq -r .data.password)"
            export PGPASSWORD="$APP_PASS"
            psql -h "$PGHOST" -p "$PGPORT" -U "$APP_USER" -d "$DB" -c "SELECT current_user, current_schema();" || exit 1
            echo "MCP DB + Vault static role ready."
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
---
# ========= Optional: ensure DB exists from app side =========
apiVersion: batch/v1
kind: Job
metadata:
  name: db-bootstrap-mcp-presence
  namespace: mcp
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: mcp-server
      containers:
        - name: bootstrap
          image: postgres:14
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          env:
            - name: YB_HOST
              value: "yb-tserver-service.yugabyte.svc.cluster.local"
            - name: YB_PORT
              value: "5433"
            - name: YB_USER
              valueFrom:
                secretKeyRef:
                  name: yb-vaultadmin
                  key: username
            - name: YB_PASS
              valueFrom:
                secretKeyRef:
                  name: yb-vaultadmin
                  key: password
          command: ["/bin/sh","-c"]
          args: |
            set -eu
            H="${YB_HOST}"
            P="${YB_PORT}"
            export PGPASSWORD="${YB_PASS}"
            psql -h "$H" -p "$P" -U "$YB_USER" -d yugabyte -tc "SELECT 1 FROM pg_database WHERE datname='mcp'" | grep -q 1 || \
              psql -h "$H" -p "$P" -U "$YB_USER" -d postgres -c "CREATE DATABASE mcp"
            echo "DB present."
---
# ========= MCP server =========
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: mcp
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: mcp-server
      nodeSelector:
        dedicated: srvr-node
      initContainers:
        - name: wait-for-yb-vaultadmin
          image: bitnami/kubectl:1.31
          command: ["sh","-c"]
          args: |
            echo "Waiting for Secret yb-vaultadmin..."
            until kubectl -n mcp get secret yb-vaultadmin >/dev/null 2>&1; do sleep 2; done
            echo "Found yb-vaultadmin."
      containers:
        - name: mcp
          image: ghcr.io/containers/kubernetes-mcp-server:v0.0.49
          args: ["--port=8080", "--log-level=4"]
          imagePullPolicy: IfNotPresent
          env:
            - name: MCP_SERVER_NAME
              valueFrom:
                configMapKeyRef:
                  name: mcp-config
                  key: MCP_SERVER_NAME
            - name: MCP_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: mcp-config
                  key: MCP_LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mcp-db-static
                  key: DATABASE_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mcp-db-static
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-db-static
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: mcp-db-static
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: mcp-db-static
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mcp-db-static
                  key: DB_NAME
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-apis
                  key: OPENAI_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: config
              mountPath: /etc/mcp/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mcp-config
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: mcp
  labels:
    app: mcp-server
spec:
  type: ClusterIP
  selector:
    app: mcp-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
# ========= AVP (Argo CD Vault Plugin) support =========
apiVersion: v1
kind: Secret
metadata:
  name: avp-config
  namespace: argocd
type: Opaque
stringData:
  AVP_AUTH_TYPE: kubernetes
  AVP_K8S_ROLE: argocd-avp
  AVP_ADDR: http://vault.vault.svc.cluster.local:8200
  AVP_K8S_MOUNT_PATH: kubernetes   # <-- fixed name
  # AVP_LOG_LEVEL: debug
---
# Allow repo-server to request ephemeral SA tokens (some AVP flows use this)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-tokenrequest
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-repo-server-to-tokenrequest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-tokenrequest
subjects:
  - kind: ServiceAccount
    name: argocd-repo-server
    namespace: argocd
---
# Ensure repo-server actually picks up the AVP env
# (If Argo CD is Helm-managed, set this via Helm values instead.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      containers:
        - name: argocd-repo-server
          envFrom:
            - secretRef:
                name: avp-config
---
# Vault role + policy for AVP (Argo CD repo-server)
apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-avp-vault-role
  namespace: vault
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-argocd-avp
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args: |
            set -eu
            export PATH="$PATH:/vault-bin"
            export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
            while [ ! -f /vault-token/VAULT_TOKEN ]; do sleep 2; done
            export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
            apk add --no-cache jq >/dev/null

            vault policy write "argocd-avp" - <<'EOF'
            path "secret/data/open_ai_key"           { capabilities = ["read"] }
            path "yugabyte-db/static-creds/mcp-app"  { capabilities = ["read"] }
            path "secret/data/vaultadmin"            { capabilities = ["read"] }
            EOF

            # Deliberately omit bound_audiences to avoid audience mismatches
            vault write auth/kubernetes/role/argocd-avp \
              bound_service_account_names="argocd-repo-server" \
              bound_service_account_namespaces="argocd" \
              policies="argocd-avp" \
              ttl="24h"

            echo "Configured AVP role/policy."
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
