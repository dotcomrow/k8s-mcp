              mountPath: /kube
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-admin
  namespace: mcp
  labels:
    app: mcp-server-admin
spec:
  type: ClusterIP
  selector:
    app: mcp-server-admin
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# ======================
# NetworkPolicy — allow only OpenWebUI + kubelet/node health probes
# ======================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-allow-openwebui-and-probes
  namespace: mcp
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["mcp-server-ro","mcp-server-admin"]
  policyTypes: ["Ingress"]
  ingress:
    # 1) Allow calls from OpenWebUI namespace (adjust selector if your OpenWebUI is labeled differently)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openwebui
      ports:
        - protocol: TCP
          port: 8080

    # 2) Allow kubelet/node health probes (REPLACE with your real node CIDR!)
    #    Tighten this ASAP (e.g., 10.0.0.0/8, 192.168.0.0/16, etc.)
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0   # TODO: set to your node subnet(s)
      ports:
        - protocol: TCP
          port: 8080
