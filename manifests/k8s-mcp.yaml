              until nc -z -w1 "${PGHOST}" "${DB_PORT}"; do echo "⏳ waiting for DB..."; sleep 2; done
              for i in $(seq 1 90); do
                if psql -tAc "SELECT 1" >/dev/null 2>&1 &&
                   psql -tAc "SELECT has_database_privilege(current_user, '${DB_NAME}', 'CREATE')" | grep -q t &&
                   psql -tAc "SELECT has_schema_privilege(current_user, '${DB_SCHEMA}', 'USAGE')" | grep -q t &&
                   psql -tAc "SELECT has_schema_privilege(current_user, '${DB_SCHEMA}', 'CREATE')" | grep -q t
                then
                  echo "✅ DB & privileges ready"; exit 0
                fi
                echo "🔁 DB not ready yet; retrying..."; sleep 2
              done
              echo "❌ timed out waiting for DB privileges"; exit 1
          volumeMounts:
            - name: driver-config
              mountPath: /etc/mcp
      containers:
        - name: bridge
          image: ghcr.io/dotcomrow/mcp-openapi-tool-server-image:ts-20250915-144748
          imagePullPolicy: Always
          env:
            - name: PATH
              value: "/mcpbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            - name: MCP_STDIO_ENABLED
              value: "1"
            - name: MCP_FORCE_STDIO
              value: "1"
            - name: MCP_STDIO_INIT_TIMEOUT
              value: "45"
            - name: MCP_STDIO_PREFLIGHT
              value: "1"
            - name: MCP_STDIO_EXTRA_ARGS
              value: ""
            - name: MCP_SERVERS
              value: |
                [
                  {
                    "alias": "mcp",
                    "mode": "stdio",
                    "cmd": ["/mcpbin/mcp-kubernetes", "--transport", "stdio"],
                    "env": { "KUBECONFIG": "/kube/config" }
                  }
                ]
            - name: MCP_DRIVER_MODULES
              value: "mcp_openapi.drivers.yugabyte_driver"
            - name: DRIVER_MANIFEST_PATH
              value: "/etc/mcp/driver-manifest.yaml"
            - name: DRIVER_CACHE_TTL_SECONDS
              value: "60"
            - name: DRIVER_CACHE_MAX_WAIT_SECONDS
              value: "10"
            - name: CORS_ALLOW_ORIGINS
