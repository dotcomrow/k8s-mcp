# ======================
# NetworkPolicies
# 1) Allow only OpenWebUI to call the bridges
# 2) Allow bridges to call MCP servers
# (we ALSO keep your existing mcp-server NetPolicy but extend its "from")
# ======================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-openapi-allow-openwebui
  namespace: mcp
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["mcp-openapi-ro","mcp-openapi-admin"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openwebui
          podSelector: {}   # (optionally refine to app=open-webui)
      ports:
        - protocol: TCP
          port: 8080
---
# Extend the existing policy that targeted only mcp-server pods
# If you applied a previous "mcp-allow-openwebui" policy, replace it with this superset.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-servers-allow-openwebui-and-bridge
  namespace: mcp
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["mcp-server-ro","mcp-server-admin"]
  policyTypes: ["Ingress"]
  ingress:
    # From OpenWebUI namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openwebui
          podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
    # From same-namespace OpenAPI bridges
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["mcp-openapi-ro","mcp-openapi-admin"]
      ports:
        - protocol: TCP
          port: 8080
