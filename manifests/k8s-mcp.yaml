apiVersion: v1
kind: Namespace
metadata:
  name: k8s-mcp-service
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=srvr-node"
    config.linkerd.io/opaque-ports: "5433,8200,443"
---
# ======================
# Service Accounts
# ======================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-ro
  namespace: k8s-mcp-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-admin
  namespace: k8s-mcp-service
---
# ======================
# RBAC
# ======================
# Read-only cluster role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-readonly
rules:
  - apiGroups: [""]
    resources: ["pods","pods/log","services","endpoints","configmaps","events","namespaces","nodes"]
    verbs: ["get","list","watch"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets","daemonsets","replicasets"]
    verbs: ["get","list","watch"]
  - apiGroups: ["batch"]
    resources: ["jobs","cronjobs"]
    verbs: ["get","list","watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get","list","watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses","networkpolicies"]
    verbs: ["get","list","watch"]
---
# Admin (broad) role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-admin
rules:
  - apiGroups: [""]
    resources: ["pods","pods/log","services","endpoints","configmaps","secrets","events","namespaces","nodes","persistentvolumeclaims"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets","daemonsets","replicasets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs","cronjobs"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles","rolebindings","clusterroles","clusterrolebindings"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses","networkpolicies"]
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]
---
# Bindings
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-readonly
subjects:
  - kind: ServiceAccount
    name: mcp-server-ro
    namespace: k8s-mcp-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-admin
subjects:
  - kind: ServiceAccount
    name: mcp-server-admin
    namespace: k8s-mcp-service
---
# =================================================================
# === OpenAPI bridge (stdio sidecar pattern) — READ-ONLY
# =================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-openapi-ro
  namespace: k8s-mcp-service
  labels: { app: mcp-openapi-ro }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-openapi-ro }
  template:
    metadata:
      labels: { app: mcp-openapi-ro }
    spec:
      serviceAccountName: mcp-server-ro
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      volumes:
        - name: kube
          emptyDir: {}
        - name: mcpbin
          emptyDir: {}
      initContainers:
        - name: write-kubeconfig
          image: alpine:3.20
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              cat > /kube/config <<EOF
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  server: ${API}
                name: in
              contexts:
              - context:
                  cluster: in
                  namespace: ${NS}
                  user: sa
                name: in
              current-context: in
              users:
              - name: sa
                user:
                  token: ${TOKEN}
              EOF
          volumeMounts:
            - name: kube
              mountPath: /kube
        - name: fetch-mcp-binary
          image: ghcr.io/azure/mcp-kubernetes:latest
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              for p in /usr/local/bin/mcp-kubernetes /app/mcp-kubernetes /mcp-kubernetes; do
                if [ -x "$p" ]; then cp "$p" /mcpbin/mcp-kubernetes && chmod +x /mcpbin/mcp-kubernetes && exit 0; fi
              done
              echo "mcp-kubernetes binary not found in image" >&2; exit 1
          volumeMounts:
            - name: mcpbin
              mountPath: /mcpbin
      containers:
        - name: bridge
          image: ghcr.io/dotcomrow/mcp-openapi-tool-server-image:ts-20250914-011453
          imagePullPolicy: Always
          env:
            - name: MCP_STDIO_ENABLED
              value: "1"
            - name: MCP_SERVERS
              value: |
                [
                  {
                    "alias": "mcp",
                    "mode": "stdio",
                    "cmd": ["/mcpbin/mcp-kubernetes", "--transport=stdio", "--access-level=readonly"],
                    "env": { "KUBECONFIG": "/kube/config" }
                  }
                ]
            - name: CORS_ALLOW_ORIGINS
              value: "*"
            - name: STARTUP_TIMEOUT
              value: "30"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - name: kube
              mountPath: /kube
            - name: mcpbin
              mountPath: /mcpbin
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-openapi-ro
  namespace: k8s-mcp-service
  labels: { app: mcp-openapi-ro }
spec:
  type: ClusterIP
  selector: { app: mcp-openapi-ro }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
