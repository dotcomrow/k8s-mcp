    metadata:
      labels: { app: mcp-openapi-admin }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "mcp-yb-admin"
        vault.hashicorp.com/auth-path: "auth/kubernetes"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-yb-username: "yugabyte-db/static-creds/mcp-yb-admin"
        vault.hashicorp.com/agent-inject-template-yb-username: |
          {{- with secret "yugabyte-db/static-creds/mcp-yb-admin" -}}{{ .Data.username }}{{- end }}
        vault.hashicorp.com/agent-inject-secret-yb-password: "yugabyte-db/static-creds/mcp-yb-admin"
        vault.hashicorp.com/agent-inject-template-yb-password: |
          {{- with secret "yugabyte-db/static-creds/mcp-yb-admin" -}}{{ .Data.password }}{{- end }}
        vault.hashicorp.com/secret-volume-path: "/vault/secrets"
    spec:
      serviceAccountName: mcp-server-admin
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      volumes:
        - name: kube
          emptyDir: {}
        - name: mcpbin
          emptyDir: {}
        - name: driver-config
          configMap:
            name: mcp-openapi-admin-driver-config
            items:
              - key: driver-manifest.yaml
                path: driver-manifest.yaml
      initContainers:
        - name: write-kubeconfig
          image: alpine:3.20
          securityContext: { runAsUser: 0, runAsNonRoot: false }
          command: ["/bin/sh","-lc"]
