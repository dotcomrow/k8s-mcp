            - |
              set -eu
              API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              cat > /kube/config <<EOF
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  server: ${API}
                name: in
              contexts:
              - context:
                  cluster: in
                  namespace: ${NS}
                  user: sa
                name: in
              current-context: in
              users:
              - name: sa
                user:
                  token: ${TOKEN}
              EOF
          volumeMounts:
            - name: kube
              mountPath: /kube
        - name: fetch-mcp-binary
          image: ghcr.io/azure/mcp-kubernetes:latest
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              for p in /usr/local/bin/mcp-kubernetes /app/mcp-kubernetes /mcp-kubernetes; do
                if [ -x "$p" ]; then cp "$p" /mcpbin/mcp-kubernetes && chmod +x /mcpbin/mcp-kubernetes && exit 0; fi
              done
              echo "mcp-kubernetes binary not found in image" >&2; exit 1
          volumeMounts:
            - name: mcpbin
              mountPath: /mcpbin
        - name: install-kubectl
          image: bitnami/kubectl:1.29
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              SRC="/opt/bitnami/kubectl/bin/kubectl"
              if [ -x "$SRC" ]; then
                cp "$SRC" /mcpbin/kubectl && chmod +x /mcpbin/kubectl
              elif command -v kubectl >/dev/null 2>&1; then
                cp "$(command -v kubectl)" /mcpbin/kubectl && chmod +x /mcpbin/kubectl
              else
                echo "kubectl not found in bitnami image" >&2; exit 1
              fi
          volumeMounts:
            - name: mcpbin
              mountPath: /mcpbin
        - name: db-ready-check
          image: alpine:3.20
          env:
            - name: DB_HOST
              value: "yb-tserver-service.yugabyte.svc.cluster.local"
            - name: DB_PORT
              value: "5433"
            - name: DB_NAME
              value: "mcp"
            - name: DB_SCHEMA
              value: "mcp_openapi_admin"
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              apk add --no-cache postgresql15-client netcat-openbsd >/dev/null
              until [ -s /vault/secrets/yb-username ] && [ -s /vault/secrets/yb-password ]; do
                echo "⏳ waiting for Vault creds..."; sleep 2
              done
              export PGHOST="${DB_HOST}" PGPORT="${DB_PORT}" PGDATABASE="${DB_NAME}"
              export PGUSER="$(cat /vault/secrets/yb-username)"
