apiVersion: v1
kind: Namespace
metadata:
  name: mcp
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=srvr-node"
    config.linkerd.io/opaque-ports: "5433,8200,443"
---
# Service accounts for RO and Admin
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-ro
  namespace: mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-admin
  namespace: mcp

# --------------------
# RBAC
# --------------------
---
# Read-only role (safe default)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-readonly
rules:
  - apiGroups: [""]
    resources: ["pods","pods/log","services","endpoints","configmaps","events","namespaces","nodes"]
    verbs: ["get","list","watch"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets","daemonsets","replicasets"]
    verbs: ["get","list","watch"]
  - apiGroups: ["batch"]
    resources: ["jobs","cronjobs"]
    verbs: ["get","list","watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get","list","watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses","networkpolicies"]
    verbs: ["get","list","watch"]
---
# Admin role (mutating)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-admin
rules:
  - apiGroups: [""]
    resources: ["pods","pods/log","services","endpoints","configmaps","secrets","events","namespaces","nodes","persistentvolumeclaims"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets","daemonsets","replicasets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs","cronjobs"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles","rolebindings","clusterroles","clusterrolebindings"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses","networkpolicies"]
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]
---
# Bindings
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-readonly
subjects:
  - kind: ServiceAccount
    name: mcp-server-ro
    namespace: mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-admin
subjects:
  - kind: ServiceAccount
    name: mcp-server-admin
    namespace: mcp

# --------------------
# Deployments & Services
# --------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server-ro
  namespace: mcp
  labels: { app: mcp-server-ro }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-server-ro }
  template:
    metadata:
      labels: { app: mcp-server-ro }
    spec:
      serviceAccountName: mcp-server-ro
      containers:
        - name: mcp
          image: ghcr.io/azure/mcp-kubernetes:latest
          imagePullPolicy: IfNotPresent
          args:
            - --transport=streamable-http
            - --host=0.0.0.0
            - --port=8080
            - --access-level=readonly
            # Optional extras:
            # - --additional-tools=helm,cilium,hubble
            # - --allow-namespaces=default,mcp
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-ro
  namespace: mcp
  labels: { app: mcp-server-ro }
spec:
  type: ClusterIP
  selector: { app: mcp-server-ro }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server-admin
  namespace: mcp
  labels: { app: mcp-server-admin }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-server-admin }
  template:
    metadata:
      labels: { app: mcp-server-admin }
    spec:
      serviceAccountName: mcp-server-admin
      containers:
        - name: mcp
          image: ghcr.io/azure/mcp-kubernetes:latest
          imagePullPolicy: IfNotPresent
          args:
            - --transport=streamable-http
            - --host=0.0.0.0
            - --port=8080
            - --access-level=admin
            # Safer alternative if you prefer limited mutation:
            # - --access-level=readwrite
            # - --allow-namespaces=default,mcp
            # - --additional-tools=helm
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-admin
  namespace: mcp
  labels: { app: mcp-server-admin }
spec:
  type: ClusterIP
  selector: { app: mcp-server-admin }
  ports:
    - name: http
      port: 8080
      targetPort: http

# --------------------
# NetworkPolicy: only allow OpenWebUI to call the MCP servers
# Adjust namespace/labels to match your OpenWebUI install.
# --------------------
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-allow-openwebui
  namespace: mcp
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["mcp-server-ro","mcp-server-admin"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openwebui
          podSelector: {}   # refine if you label OpenWebUI pods (e.g., app=openwebui)
      ports:
        - protocol: TCP
          port: 8080
