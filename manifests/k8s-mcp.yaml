apiVersion: v1
kind: Namespace
metadata:
  name: k8s-mcp-service
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=srvr-node"
    config.linkerd.io/opaque-ports: "5433,8200,443"
---
# ======================
# Service Accounts
# ======================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-ro
  namespace: k8s-mcp-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-admin
  namespace: k8s-mcp-service
---
# ======================
# RBAC
# ======================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-readonly
rules:
  - apiGroups: [""]
    resources: ["pods","pods/log","services","endpoints","configmaps","events","namespaces","nodes"]
    verbs: ["get","list","watch"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets","daemonsets","replicasets"]
    verbs: ["get","list","watch"]
  - apiGroups: ["batch"]
    resources: ["jobs","cronjobs"]
    verbs: ["get","list","watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get","list","watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses","networkpolicies"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-admin
rules:
  - apiGroups: [""]
    resources: ["pods","pods/log","services","endpoints","configmaps","secrets","events","namespaces","nodes","persistentvolumeclaims"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets","daemonsets","replicasets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs","cronjobs"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles","rolebindings","clusterroles","clusterrolebindings"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses","networkpolicies"]
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-readonly
subjects:
  - kind: ServiceAccount
    name: mcp-server-ro
    namespace: k8s-mcp-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-admin
subjects:
  - kind: ServiceAccount
    name: mcp-server-admin
    namespace: k8s-mcp-service
---
# ======================
# Driver Configs (per-deployment) — wave 0
# ======================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-openapi-ro-driver-config
  namespace: k8s-mcp-service
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  driver-manifest.yaml: |
    apiVersion: mcp.openapi/v1alpha1
    kind: DriverManifest
    metadata:
      name: yugabyte
    spec:
      drivers:
        - name: yugabyte
          config:
            redis:
              url: redis://redis.redis.svc.cluster.local:6379/0
              namespace: k8s-mcp-service:mcp-openapi-ro
              key_prefix: mcp
              ttl_seconds: 60
            yugabyte:
              host: yb-tserver-service.yugabyte.svc.cluster.local
              port: 5433
              database: mcp
              schema: mcp_openapi_ro
              sslmode: disable
              usernameFile: /vault/secrets/yb-username
              passwordFile: /vault/secrets/yb-password
              pool:
                min_size: 1
                max_size: 8
            bootstrap:
              create_schema: true
              run_migrations: true
            sync:
              enabled: true
              interval_seconds: 15
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-openapi-admin-driver-config
  namespace: k8s-mcp-service
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  driver-manifest.yaml: |
    apiVersion: mcp.openapi/v1alpha1
    kind: DriverManifest
    metadata:
      name: yugabyte
    spec:
      drivers:
        - name: yugabyte
          config:
            redis:
              url: redis://redis.redis.svc.cluster.local:6379/0
              namespace: k8s-mcp-service:mcp-openapi-admin
              key_prefix: mcp
              ttl_seconds: 60
            yugabyte:
              host: yb-tserver-service.yugabyte.svc.cluster.local
              port: 5433
              database: mcp
              schema: mcp_openapi_admin
              sslmode: disable
              usernameFile: /vault/secrets/yb-username
              passwordFile: /vault/secrets/yb-password
              pool:
                min_size: 1
                max_size: 8
            bootstrap:
              create_schema: true
              run_migrations: true
            sync:
              enabled: true
              interval_seconds: 10
---
# =================================================================
# Init: Vault + Yugabyte setup (two static users; equal perms) — wave 0
# =================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: mcp-yugabyte-config
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-mcp
          image: hashicorp/vault:1.15.4
          env:
            - name: RESET_SCHEMAS
              value: "false"   # set to "true" once to drop & recreate schemas
            - name: YSQL_SU_KV_PATH
              value: "secret/yugabyte-su"  # optional superuser takeover KV
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail

              PGHOST="yb-tserver-service.yugabyte.svc.cluster.local"
              PGPORT="5433"
              ADMIN_DB="yugabyte"
              APP_DB="mcp"

              VAULTADMIN_USER="vaultadmin"
              VAULTADMIN_KV_PATH="secret/vaultadmin"

              # two static DB users with identical permissions
              USER_ADMIN="mcp_admin"
              USER_RO="mcp_ro"

              SCHEMA_RO="mcp_openapi_ro"
              SCHEMA_ADMIN="mcp_openapi_admin"

              VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              AUTH_PATH="kubernetes"

              DB_MOUNT="yugabyte-db"
              DB_NAME_IN_VAULT="yugabyte"
              ROLE_STATIC_ADMIN="mcp-yb-admin"
              ROLE_STATIC_RO="mcp-yb-ro"

              apk add --no-cache postgresql15-client jq curl netcat-openbsd >/dev/null || true

              export PATH="$PATH:/vault-bin"
              export VAULT_ADDR

              until [ -s /vault-token/VAULT_TOKEN ]; do echo "🔁 waiting for /vault-token/VAULT_TOKEN..."; sleep 2; done
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              echo "🔐 Fetching ${VAULTADMIN_KV_PATH}..."
              VAULTADMIN_PASS="$(vault kv get -format=json "${VAULTADMIN_KV_PATH}" | jq -r '.data.data.password // .data.data.value')"

              until getent hosts "$PGHOST" >/dev/null 2>&1; do echo "🔄 waiting for DNS $PGHOST..."; sleep 3; done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do echo "⏳ waiting for DB $PGHOST:$PGPORT..."; sleep 3; done
              echo "✅ Yugabyte reachable"

              export PGPASSWORD="$VAULTADMIN_PASS"

              DB_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$ADMIN_DB" -Atc "SELECT 1 FROM pg_database WHERE datname='${APP_DB}'" || true)"
              if [ "${DB_EXISTS}" != "1" ]; then
                echo "📦 Creating DB '${APP_DB}' owned by ${VAULTADMIN_USER}…"
                createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$APP_DB"
              else
                echo "✅ DB '${APP_DB}' exists"
              fi

              if [ "${RESET_SCHEMAS}" = "true" ]; then
                echo "⚠️  RESET_SCHEMAS=true -> dropping schemas ${SCHEMA_RO}, ${SCHEMA_ADMIN}"
                psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=0 -c "DROP SCHEMA IF EXISTS ${SCHEMA_RO} CASCADE;"
                psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=0 -c "DROP SCHEMA IF EXISTS ${SCHEMA_ADMIN} CASCADE;"
              fi

              # Create the two static login roles if missing
              ADMIN_ROLE_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -Atc "SELECT 1 FROM pg_roles WHERE rolname='${USER_ADMIN}'" || true)"
              if [ "${ADMIN_ROLE_EXISTS:-}" != "1" ]; then
                echo "➕ Creating role ${USER_ADMIN}"
                psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                  -c "CREATE ROLE ${USER_ADMIN} LOGIN PASSWORD 'temp-initial';"
              else
                echo "✅ Role ${USER_ADMIN} exists"
              fi

              RO_ROLE_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -Atc "SELECT 1 FROM pg_roles WHERE rolname='${USER_RO}'" || true)"
              if [ "${RO_ROLE_EXISTS:-}" != "1" ]; then
                echo "➕ Creating role ${USER_RO}"
                psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                  -c "CREATE ROLE ${USER_RO} LOGIN PASSWORD 'temp-initial';"
              else
                echo "✅ Role ${USER_RO} exists"
              fi

              # Make vaultadmin a member so it can run "ALTER DEFAULT PRIVILEGES FOR ROLE …"
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                -c "GRANT ${USER_ADMIN} TO ${VAULTADMIN_USER} WITH ADMIN OPTION;"
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 \
                -c "GRANT ${USER_RO} TO ${VAULTADMIN_USER} WITH ADMIN OPTION;"

              # Create schemas (owned by vaultadmin) & grant equal perms to both users
              cat >/tmp/mcp_safe.sql <<SQL
              CREATE SCHEMA IF NOT EXISTS ${SCHEMA_RO}    AUTHORIZATION ${VAULTADMIN_USER};
              CREATE SCHEMA IF NOT EXISTS ${SCHEMA_ADMIN} AUTHORIZATION ${VAULTADMIN_USER};

              GRANT ALL PRIVILEGES ON DATABASE ${APP_DB} TO ${VAULTADMIN_USER};
              GRANT ALL PRIVILEGES ON DATABASE ${APP_DB} TO ${USER_ADMIN};
              GRANT ALL PRIVILEGES ON DATABASE ${APP_DB} TO ${USER_RO};

              GRANT USAGE, CREATE ON SCHEMA ${SCHEMA_RO}    TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};
              GRANT USAGE, CREATE ON SCHEMA ${SCHEMA_ADMIN} TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};
              SQL
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 -f /tmp/mcp_safe.sql
              echo "✅ DB & schema-level grants applied"

              # Best-effort grants on existing objects (may fail if owned by old dynamic users)
              cat >/tmp/mcp_best_effort.sql <<SQL
              GRANT ALL PRIVILEGES ON ALL TABLES    IN SCHEMA ${SCHEMA_RO}    TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA ${SCHEMA_RO}    TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};
              GRANT ALL PRIVILEGES ON ALL TABLES    IN SCHEMA ${SCHEMA_ADMIN} TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA ${SCHEMA_ADMIN} TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};
              SQL
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=0 -f /tmp/mcp_best_effort.sql || true

              # Default privileges for FUTURE objects created by ANY of the three roles
              cat >/tmp/mcp_default_privs.sql <<SQL
              -- objects created by vaultadmin
              ALTER DEFAULT PRIVILEGES FOR ROLE ${VAULTADMIN_USER} IN SCHEMA ${SCHEMA_RO}
                GRANT ALL PRIVILEGES ON TABLES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};
              ALTER DEFAULT PRIVILEGES FOR ROLE ${VAULTADMIN_USER} IN SCHEMA ${SCHEMA_ADMIN}
                GRANT ALL PRIVILEGES ON TABLES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};
              ALTER DEFAULT PRIVILEGES FOR ROLE ${VAULTADMIN_USER} IN SCHEMA ${SCHEMA_RO}
                GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};
              ALTER DEFAULT PRIVILEGES FOR ROLE ${VAULTADMIN_USER} IN SCHEMA ${SCHEMA_ADMIN}
                GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};

              -- objects created by mcp_admin
              ALTER DEFAULT PRIVILEGES FOR ROLE ${USER_ADMIN} IN SCHEMA ${SCHEMA_RO}
                GRANT ALL PRIVILEGES ON TABLES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};
              ALTER DEFAULT PRIVILEGES FOR ROLE ${USER_ADMIN} IN SCHEMA ${SCHEMA_ADMIN}
                GRANT ALL PRIVILEGES ON TABLES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};
              ALTER DEFAULT PRIVILEGES FOR ROLE ${USER_ADMIN} IN SCHEMA ${SCHEMA_RO}
                GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};
              ALTER DEFAULT PRIVILEGES FOR ROLE ${USER_ADMIN} IN SCHEMA ${SCHEMA_ADMIN}
                GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};

              -- objects created by mcp_ro (same rights)
              ALTER DEFAULT PRIVILEGES FOR ROLE ${USER_RO} IN SCHEMA ${SCHEMA_RO}
                GRANT ALL PRIVILEGES ON TABLES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};
              ALTER DEFAULT PRIVILEGES FOR ROLE ${USER_RO} IN SCHEMA ${SCHEMA_ADMIN}
                GRANT ALL PRIVILEGES ON TABLES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};
              ALTER DEFAULT PRIVILEGES FOR ROLE ${USER_RO} IN SCHEMA ${SCHEMA_RO}
                GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};
              ALTER DEFAULT PRIVILEGES FOR ROLE ${USER_RO} IN SCHEMA ${SCHEMA_ADMIN}
                GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO ${VAULTADMIN_USER}, ${USER_ADMIN}, ${USER_RO};
              SQL
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 -f /tmp/mcp_default_privs.sql

              echo "ℹ️ Existing migrations owners (if any):"
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" \
                -c "SELECT schemaname, tablename, tableowner FROM pg_catalog.pg_tables WHERE schemaname IN ('${SCHEMA_RO}','${SCHEMA_ADMIN}') AND tablename='mcp_migrations';" || true

              # Optional: superuser takeover to flip ownership of legacy objects
              if vault kv get -format=json "${YSQL_SU_KV_PATH}" >/dev/null 2>&1; then
                echo "🔧 Superuser takeover enabled via ${YSQL_SU_KV_PATH}"
                SU_USER="$(vault kv get -format=json "${YSQL_SU_KV_PATH}" | jq -r '.data.data.username // "yugabyte"')"
                SU_PASS="$(vault kv get -format=json "${YSQL_SU_KV_PATH}" | jq -r '.data.data.password')"
                export PGPASSWORD="$SU_PASS"

                psql -h "$PGHOST" -p "$PGPORT" -U "$SU_USER" -d "$APP_DB" -Atc \
                  "SELECT 'ALTER TABLE '||quote_ident(schemaname)||'.'||quote_ident(tablename)||' OWNER TO ${USER_ADMIN};'
                     FROM pg_catalog.pg_tables
                    WHERE schemaname IN ('${SCHEMA_RO}','${SCHEMA_ADMIN}');" \
                  | psql -h "$PGHOST" -p "$PGPORT" -U "$SU_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 -f -

                psql -h "$PGHOST" -p "$PGPORT" -U "$SU_USER" -d "$APP_DB" -Atc \
                  "SELECT 'ALTER SEQUENCE '||quote_ident(sequence_schema)||'.'||quote_ident(sequence_name)||' OWNER TO ${USER_ADMIN};'
                     FROM information_schema.sequences
                    WHERE sequence_schema IN ('${SCHEMA_RO}','${SCHEMA_ADMIN}');" \
                  | psql -h "$PGHOST" -p "$PGPORT" -U "$SU_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 -f -

                echo "✅ Ownership set to ${USER_ADMIN}"
                export PGPASSWORD="$VAULTADMIN_PASS"
                psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 -f /tmp/mcp_best_effort.sql
              else
                echo "ℹ️ Superuser KV not found; skipping ownership takeover."
              fi

              # Vault: Postgres connection + static users with rotating passwords
              if ! vault secrets list -format=json | jq -e 'has("'"${DB_MOUNT}"'/")' >/dev/null 2>&1; then
                vault secrets enable -path="${DB_MOUNT}" database
              fi

              vault write "${DB_MOUNT}/static-roles/${ROLE_STATIC_ADMIN}" \
                db_name="${DB_NAME_IN_VAULT}" \
                username="${USER_ADMIN}" \
                rotation_period="24h" \
                rotation_statements="ALTER ROLE \"${USER_ADMIN}\" WITH PASSWORD '{{password}}';"

              vault write "${DB_MOUNT}/static-roles/${ROLE_STATIC_RO}" \
                db_name="${DB_NAME_IN_VAULT}" \
                username="${USER_RO}" \
                rotation_period="24h" \
                rotation_statements="ALTER ROLE \"${USER_RO}\" WITH PASSWORD '{{password}}';"

              vault write -f "${DB_MOUNT}/rotate-role/${ROLE_STATIC_ADMIN}" >/dev/null
              vault write -f "${DB_MOUNT}/rotate-role/${ROLE_STATIC_RO}" >/dev/null

              vault policy write "${ROLE_STATIC_ADMIN}" - <<EOF
              path "${DB_MOUNT}/static-creds/${ROLE_STATIC_ADMIN}" { capabilities = ["read"] }
              EOF
              vault policy write "${ROLE_STATIC_RO}" - <<EOF
              path "${DB_MOUNT}/static-creds/${ROLE_STATIC_RO}" { capabilities = ["read"] }
              EOF

              vault write auth/${AUTH_PATH}/role/${ROLE_STATIC_ADMIN} \
                bound_service_account_names="mcp-server-admin" \
                bound_service_account_namespaces="k8s-mcp-service" \
                policies="${ROLE_STATIC_ADMIN}" \
                ttl="24h"

              vault write auth/${AUTH_PATH}/role/${ROLE_STATIC_RO} \
                bound_service_account_names="mcp-server-ro" \
                bound_service_account_namespaces="k8s-mcp-service" \
                policies="${ROLE_STATIC_RO}" \
                ttl="24h"

              echo "🎉 Setup complete (two static users with equal permissions; passwords rotating)."
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
---
# =================================================================
# === OpenAPI bridge (stdio sidecar) — READ-ONLY INSTANCE — wave 1
# =================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-openapi-ro
  namespace: k8s-mcp-service
  labels: { app: mcp-openapi-ro }
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-openapi-ro }
  template:
    metadata:
      labels: { app: mcp-openapi-ro }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "mcp-yb-ro"
        vault.hashicorp.com/auth-path: "auth/kubernetes"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-yb-username: "yugabyte-db/static-creds/mcp-yb-ro"
        vault.hashicorp.com/agent-inject-template-yb-username: |
          {{- with secret "yugabyte-db/static-creds/mcp-yb-ro" -}}{{ .Data.username }}{{- end }}
        vault.hashicorp.com/agent-inject-secret-yb-password: "yugabyte-db/static-creds/mcp-yb-ro"
        vault.hashicorp.com/agent-inject-template-yb-password: |
          {{- with secret "yugabyte-db/static-creds/mcp-yb-ro" -}}{{ .Data.password }}{{- end }}
        vault.hashicorp.com/secret-volume-path: "/vault/secrets"
    spec:
      serviceAccountName: mcp-server-ro
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      volumes:
        - name: kube
          emptyDir: {}
        - name: mcpbin
          emptyDir: {}
        - name: driver-config
          configMap:
            name: mcp-openapi-ro-driver-config
            items:
              - key: driver-manifest.yaml
                path: driver-manifest.yaml
      initContainers:
        - name: write-kubeconfig
          image: alpine:3.20
          securityContext: { runAsUser: 0, runAsNonRoot: false }
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              cat > /kube/config <<EOF
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  server: ${API}
                name: in
              contexts:
              - context:
                  cluster: in
                  namespace: ${NS}
                  user: sa
                name: in
              current-context: in
              users:
              - name: sa
                user:
                  token: ${TOKEN}
              EOF
          volumeMounts:
            - name: kube
              mountPath: /kube
        - name: fetch-mcp-binary
          image: ghcr.io/azure/mcp-kubernetes:latest
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              for p in /usr/local/bin/mcp-kubernetes /app/mcp-kubernetes /mcp-kubernetes; do
                if [ -x "$p" ]; then cp "$p" /mcpbin/mcp-kubernetes && chmod +x /mcpbin/mcp-kubernetes && exit 0; fi
              done
              echo "mcp-kubernetes binary not found in image" >&2; exit 1
          volumeMounts:
            - name: mcpbin
              mountPath: /mcpbin
        - name: install-kubectl
          image: bitnami/kubectl:1.29
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              SRC="/opt/bitnami/kubectl/bin/kubectl"
              if [ -x "$SRC" ]; then
                cp "$SRC" /mcpbin/kubectl && chmod +x /mcpbin/kubectl
              elif command -v kubectl >/dev/null 2>&1; then
                cp "$(command -v kubectl)" /mcpbin/kubectl && chmod +x /mcpbin/kubectl
              else
                echo "kubectl not found in bitnami image" >&2; exit 1
              fi
          volumeMounts:
            - name: mcpbin
              mountPath: /mcpbin
        - name: db-ready-check
          image: alpine:3.20
