apiVersion: v1
kind: Namespace
metadata:
  name: k8s-mcp-service
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=srvr-node"
    config.linkerd.io/opaque-ports: "5433,8200,443"
---
# ======================
# Service Accounts
# ======================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-ro
  namespace: k8s-mcp-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-admin
  namespace: k8s-mcp-service
---
# ======================
# RBAC
# ======================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-readonly
rules:
  - apiGroups: [""]
    resources: ["pods","pods/log","services","endpoints","configmaps","events","namespaces","nodes"]
    verbs: ["get","list","watch"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets","daemonsets","replicasets"]
    verbs: ["get","list","watch"]
  - apiGroups: ["batch"]
    resources: ["jobs","cronjobs"]
    verbs: ["get","list","watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get","list","watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses","networkpolicies"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-admin
rules:
  - apiGroups: [""]
    resources: ["pods","pods/log","services","endpoints","configmaps","secrets","events","namespaces","nodes","persistentvolumeclaims"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets","daemonsets","replicasets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs","cronjobs"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles","rolebindings","clusterroles","clusterrolebindings"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses","networkpolicies"]
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-readonly
subjects:
  - kind: ServiceAccount
    name: mcp-server-ro
    namespace: k8s-mcp-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-admin
subjects:
  - kind: ServiceAccount
    name: mcp-server-admin
    namespace: k8s-mcp-service
---
# ======================
# App/Driver Manifests (per-deployment) — wave 0
# ======================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-openapi-ro-driver-config
  namespace: k8s-mcp-service
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  driver-manifest.yaml: |
    apiVersion: mcp.openapi/v1alpha1
    kind: DriverManifest
    metadata:
      name: mcp-openapi-ro
    spec:
      instanceId: k8s-mcp-service:mcp-openapi-ro

      redis:
        url: redis://:<path:secret/data/redis#password>@redis-0.redis-headless.redis.svc.cluster.local:6379/0
        namespace: driver:k8s-mcp-service:mcp-openapi-ro
        key_prefix: driver
        default_ttl_seconds: 600

      transport:
        prefer: stdio
        stdio:
          enabled: true
          force: true
          initTimeoutSeconds: 45
          preflight: true
          preflightConfig: false
          extraArgs: []
        rpc:
          url: ""   # optional HTTP RPC endpoint (leave empty to skip)
        forward:
          url: ""   # optional fallback forward URL
        servers:
          - alias: mcp
            mode: stdio
            cmd: ["/mcpbin/mcp-kubernetes","--transport","stdio","--access-level","readonly"]
            env:
              KUBECONFIG: "/kube/config"
              PATH: "/mcpbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            cwd: "/"

      cors:
        allow_origins: ["*"]
        allow_methods: ["*"]
        allow_headers: ["*"]

      migrator:
        run: true
        db:
          host: yb-tserver-service.yugabyte.svc.cluster.local
          port: 5433
          name: mcp
          schema: mcp_openapi_ro
          sslmode: disable
          usernameFile: /vault/secrets/yb-username
          passwordFile: /vault/secrets/yb-password
          migrationsDir: /app/migrations
          seedsDir: /app/seeds

      drivers:
        - name: yugabyte
          module: mcp_openapi.drivers.yugabyte_driver
          config:
            vault:
              address: http://vault.vault.svc.cluster.local:8200
              auth:
                method: kubernetes
                mount: kubernetes
                role: mcp-yb-ro
              database:
                mount: yugabyte-db
                role: mcp-yb-ro
                mode: static          # <— static creds path
                renewBefore: 120
            yugabyte:
              host: yb-tserver-service.yugabyte.svc.cluster.local
              port: 5433
              dbname: mcp
              sslmode: disable
            init:
              schema: mcp_openapi_ro
              createIfMissing: true
              ddl: []
            pool:
              min: 1
              max: 8
              statementTimeoutMs: 60000
            cache:
              ttlSeconds: 600
            sync:
              jobs:
                - name: tables
                  query: |
                    select table_schema||'.'||table_name as fqn
                    from information_schema.tables
                    where table_schema in ('public','mcp_openapi_ro')
                    order by 1
                  key: tables
                  mode: list
                  intervalSeconds: 60
                  ttlSeconds: 600
---
