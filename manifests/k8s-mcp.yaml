apiVersion: v1
kind: Namespace
metadata:
  name: k8s-mcp-service
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:applications
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=srvr-node"
    config.linkerd.io/opaque-ports: "5433,8200,443"
---
# ======================
# Service Accounts
# ======================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-ro
  namespace: k8s-mcp-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-admin
  namespace: k8s-mcp-service
---
# ======================
# RBAC
# ======================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-readonly
rules:
  - apiGroups: [""]
    resources: ["pods","pods/log","services","endpoints","configmaps","events","namespaces","nodes"]
    verbs: ["get","list","watch"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets","daemonsets","replicasets"]
    verbs: ["get","list","watch"]
  - apiGroups: ["batch"]
    resources: ["jobs","cronjobs"]
    verbs: ["get","list","watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get","list","watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses","networkpolicies"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-admin
rules:
  - apiGroups: [""]
    resources: ["pods","pods/log","services","endpoints","configmaps","secrets","events","namespaces","nodes","persistentvolumeclaims"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets","daemonsets","replicasets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs","cronjobs"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles","rolebindings","clusterroles","clusterrolebindings"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses","networkpolicies"]
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-readonly
subjects:
  - kind: ServiceAccount
    name: mcp-server-ro
    namespace: k8s-mcp-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-admin
subjects:
  - kind: ServiceAccount
    name: mcp-server-admin
    namespace: k8s-mcp-service
---
# ======================
# Driver Configs (per-deployment)
# ======================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-openapi-ro-driver-config
  namespace: k8s-mcp-service
data:
  driver-manifest.yaml: |
    apiVersion: mcp.openapi/v1alpha1
    kind: DriverManifest
    metadata:
      name: yugabyte
    spec:
      drivers:
        - name: yugabyte
          config:
            redis:
              url: redis://redis.redis.svc.cluster.local:6379/0
              namespace: k8s-mcp-service:mcp-openapi-ro
              key_prefix: mcp
              ttl_seconds: 60
            yugabyte:
              host: yb-tserver-service.yugabyte.svc.cluster.local
              port: 5433
              database: mcp
              schema: mcp_openapi_ro
              sslmode: disable
              usernameFile: /vault/secrets/yb-username
              passwordFile: /vault/secrets/yb-password
              role: mcp_group_app
              pool:
                min_size: 1
                max_size: 8
            bootstrap:
              create_schema: true
              run_migrations: true
            sync:
              enabled: true
              interval_seconds: 15
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-openapi-admin-driver-config
  namespace: k8s-mcp-service
data:
  driver-manifest.yaml: |
    apiVersion: mcp.openapi/v1alpha1
    kind: DriverManifest
    metadata:
      name: yugabyte
    spec:
      drivers:
        - name: yugabyte
          config:
            redis:
              url: redis://redis.redis.svc.cluster.local:6379/0
              namespace: k8s-mcp-service:mcp-openapi-admin
              key_prefix: mcp
              ttl_seconds: 60
            yugabyte:
              host: yb-tserver-service.yugabyte.svc.cluster.local
              port: 5433
              database: mcp
              schema: mcp_openapi_admin
              sslmode: disable
              usernameFile: /vault/secrets/yb-username
              passwordFile: /vault/secrets/yb-password
              role: mcp_group_app
              pool:
                min_size: 1
                max_size: 8
            bootstrap:
              create_schema: true
              run_migrations: true
            sync:
              enabled: true
              interval_seconds: 10
---
# =================================================================
# Init: Vault + Yugabyte setup (single app role/policy; full RW)
# =================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: mcp-yugabyte-config
  namespace: vault
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-mcp
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail

              # --- Config ---
              PGHOST="yb-tserver-service.yugabyte.svc.cluster.local"
              PGPORT="5433"
              ADMIN_DB="yugabyte"
              APP_DB="mcp"
              VAULTADMIN_USER="vaultadmin"
              VAULTADMIN_KV_PATH="secret/vaultadmin"

              ROLE_GROUP_RO="mcp_group_ro"
              ROLE_GROUP_ADMIN="mcp_group_admin"
              ROLE_GROUP_APP="mcp_group_app"
              SCHEMA_RO="mcp_openapi_ro"
              SCHEMA_ADMIN="mcp_openapi_admin"

              VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              AUTH_PATH="kubernetes"

              DB_MOUNT="yugabyte-db"
              DB_NAME_IN_VAULT="yugabyte"
              VAULT_ROLE_RO="mcp-yb-ro"
              VAULT_ROLE_ADMIN="mcp-yb-admin"
              VAULT_ROLE_APP="mcp-yb-app"

              SA_NS="k8s-mcp-service"
              SA_RO="mcp-server-ro"
              SA_ADMIN="mcp-server-admin"

              apk add --no-cache postgresql15-client jq curl netcat-openbsd >/dev/null

              export PATH="$PATH:/vault-bin"
              export VAULT_ADDR

              # --- Vault root token from mounted secret ---
              until [ -s /vault-token/VAULT_TOKEN ]; do echo "🔁 waiting for /vault-token/VAULT_TOKEN..."; sleep 2; done
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              # --- Resolve vaultadmin password from KV ---
              echo "🔐 Fetching ${VAULTADMIN_KV_PATH}..."
              VAULTADMIN_PASS="$(vault kv get -format=json "${VAULTADMIN_KV_PATH}" | jq -r '.data.data.password // .data.data.value')"

              # --- DB reachability ---
              until getent hosts "$PGHOST" >/dev/null 2>&1; do echo "🔄 waiting for DNS $PGHOST..."; sleep 3; done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do echo "⏳ waiting for DB $PGHOST:$PGPORT..."; sleep 3; done
              echo "✅ Yugabyte reachable"

              export PGPASSWORD="$VAULTADMIN_PASS"

              # --- Ensure APP_DB exists ---
              DB_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$ADMIN_DB" -tAc "SELECT 1 FROM pg_database WHERE datname='${APP_DB}'" || true)"
              if [ "$DB_EXISTS" != "1" ]; then
                echo "📦 Creating DB '${APP_DB}' owned by ${VAULTADMIN_USER}…"
                createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$APP_DB"
              else
                echo "✅ DB '${APP_DB}' exists"
              fi

              # --- Ensure roles exist (no DO $$ … $$) ---
              ensure_role () {
                local role="$1"
                local exists
                exists="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -tAc "SELECT 1 FROM pg_roles WHERE rolname='${role}'" || true)"
                if [ "$exists" != "1" ]; then
                  echo "➕ Creating role ${role}"
                  psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 -c "CREATE ROLE ${role} NOLOGIN;"
                else
                  echo "✅ Role ${role} exists"
                fi
              }
              ensure_role "${ROLE_GROUP_RO}"
              ensure_role "${ROLE_GROUP_ADMIN}"
              ensure_role "${ROLE_GROUP_APP}"

              # --- Build SQL (schemas, grants, defaults) into a temp file ---
              cat >/tmp/mcp_init.sql <<SQL
              CREATE SCHEMA IF NOT EXISTS ${SCHEMA_RO}    AUTHORIZATION ${VAULTADMIN_USER};
              CREATE SCHEMA IF NOT EXISTS ${SCHEMA_ADMIN} AUTHORIZATION ${VAULTADMIN_USER};

              -- Admin privileges (full)
              GRANT USAGE, CREATE ON SCHEMA ${SCHEMA_RO}    TO ${ROLE_GROUP_ADMIN};
              GRANT USAGE, CREATE ON SCHEMA ${SCHEMA_ADMIN} TO ${ROLE_GROUP_ADMIN};
              GRANT ALL PRIVILEGES ON ALL TABLES    IN SCHEMA ${SCHEMA_RO}    TO ${ROLE_GROUP_ADMIN};
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA ${SCHEMA_RO}    TO ${ROLE_GROUP_ADMIN};
              GRANT ALL PRIVILEGES ON ALL TABLES    IN SCHEMA ${SCHEMA_ADMIN} TO ${ROLE_GROUP_ADMIN};
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA ${SCHEMA_ADMIN} TO ${ROLE_GROUP_ADMIN};
              ALTER DEFAULT PRIVILEGES IN SCHEMA ${SCHEMA_RO}    GRANT ALL ON TABLES    TO ${ROLE_GROUP_ADMIN};
              ALTER DEFAULT PRIVILEGES IN SCHEMA ${SCHEMA_RO}    GRANT ALL ON SEQUENCES TO ${ROLE_GROUP_ADMIN};
              ALTER DEFAULT PRIVILEGES IN SCHEMA ${SCHEMA_ADMIN} GRANT ALL ON TABLES    TO ${ROLE_GROUP_ADMIN};
              ALTER DEFAULT PRIVILEGES IN SCHEMA ${SCHEMA_ADMIN} GRANT ALL ON SEQUENCES TO ${ROLE_GROUP_ADMIN};

              -- App group (full RW for tool instances)
              GRANT USAGE, CREATE ON SCHEMA ${SCHEMA_RO}    TO ${ROLE_GROUP_APP};
              GRANT USAGE, CREATE ON SCHEMA ${SCHEMA_ADMIN} TO ${ROLE_GROUP_APP};
              GRANT ALL PRIVILEGES ON ALL TABLES    IN SCHEMA ${SCHEMA_RO}    TO ${ROLE_GROUP_APP};
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA ${SCHEMA_RO}    TO ${ROLE_GROUP_APP};
              GRANT ALL PRIVILEGES ON ALL TABLES    IN SCHEMA ${SCHEMA_ADMIN} TO ${ROLE_GROUP_APP};
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA ${SCHEMA_ADMIN} TO ${ROLE_GROUP_APP};
              ALTER DEFAULT PRIVILEGES IN SCHEMA ${SCHEMA_RO}    GRANT ALL ON TABLES    TO ${ROLE_GROUP_APP};
              ALTER DEFAULT PRIVILEGES IN SCHEMA ${SCHEMA_RO}    GRANT ALL ON SEQUENCES TO ${ROLE_GROUP_APP};
              ALTER DEFAULT PRIVILEGES IN SCHEMA ${SCHEMA_ADMIN} GRANT ALL ON TABLES    TO ${ROLE_GROUP_APP};
              ALTER DEFAULT PRIVILEGES IN SCHEMA ${SCHEMA_ADMIN} GRANT ALL ON SEQUENCES TO ${ROLE_GROUP_APP};

              -- Read-only privileges (optional; kept for future)
              GRANT USAGE ON SCHEMA ${SCHEMA_RO}    TO ${ROLE_GROUP_RO};
              GRANT USAGE ON SCHEMA ${SCHEMA_ADMIN} TO ${ROLE_GROUP_RO};
              GRANT SELECT ON ALL TABLES    IN SCHEMA ${SCHEMA_RO}    TO ${ROLE_GROUP_RO};
              GRANT SELECT ON ALL SEQUENCES IN SCHEMA ${SCHEMA_RO}    TO ${ROLE_GROUP_RO};
              GRANT SELECT ON ALL TABLES    IN SCHEMA ${SCHEMA_ADMIN} TO ${ROLE_GROUP_RO};
              GRANT SELECT ON ALL SEQUENCES IN SCHEMA ${SCHEMA_ADMIN} TO ${ROLE_GROUP_RO};
              ALTER DEFAULT PRIVILEGES IN SCHEMA ${SCHEMA_RO}    GRANT SELECT ON TABLES    TO ${ROLE_GROUP_RO};
              ALTER DEFAULT PRIVILEGES IN SCHEMA ${SCHEMA_RO}    GRANT SELECT ON SEQUENCES TO ${ROLE_GROUP_RO};
              ALTER DEFAULT PRIVILEGES IN SCHEMA ${SCHEMA_ADMIN} GRANT SELECT ON TABLES    TO ${ROLE_GROUP_RO};
              ALTER DEFAULT PRIVILEGES IN SCHEMA ${SCHEMA_ADMIN} GRANT SELECT ON SEQUENCES TO ${ROLE_GROUP_RO};
              SQL

              # --- Apply SQL atomically; stop on first error ---
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$APP_DB" -v ON_ERROR_STOP=1 -f /tmp/mcp_init.sql
              echo "✅ Schemas & grants prepared"

              # --- Vault database engine + dynamic roles/policies ---
              if ! vault secrets list -format=json | jq -e 'has("'"${DB_MOUNT}"'/")' >/dev/null 2>&1; then
                vault secrets enable -path="${DB_MOUNT}" database
              fi

              # RO dynamic role (kept for compatibility)
              vault write "${DB_MOUNT}/roles/${VAULT_ROLE_RO}" \
                db_name="${DB_NAME_IN_VAULT}" \
                default_ttl="1h" \
                max_ttl="24h" \
                creation_statements=$'CREATE ROLE "{{name}}" WITH LOGIN PASSWORD \'{{password}}\' VALID UNTIL \'{{expiration}}\';\nGRANT '"${ROLE_GROUP_RO}"' TO "{{name}}";'

              # ADMIN dynamic role (kept for compatibility)
              vault write "${DB_MOUNT}/roles/${VAULT_ROLE_ADMIN}" \
                db_name="${DB_NAME_IN_VAULT}" \
                default_ttl="1h" \
                max_ttl="24h" \
                creation_statements=$'CREATE ROLE "{{name}}" WITH LOGIN PASSWORD \'{{password}}\' VALID UNTIL \'{{expiration}}\';\nGRANT '"${ROLE_GROUP_ADMIN}"' TO "{{name}}";'

              # APP dynamic role (the one pods use)
              vault write "${DB_MOUNT}/roles/${VAULT_ROLE_APP}" \
                db_name="${DB_NAME_IN_VAULT}" \
                default_ttl="1h" \
                max_ttl="24h" \
                creation_statements=$'CREATE ROLE "{{name}}" WITH LOGIN PASSWORD \'{{password}}\' VALID UNTIL \'{{expiration}}\';\nGRANT '"${ROLE_GROUP_APP}"' TO "{{name}}";'

              # Policies to read creds
              vault policy write "${VAULT_ROLE_RO}" - <<EOF
              path "${DB_MOUNT}/creds/${VAULT_ROLE_RO}" { capabilities = ["read"] }
              EOF
              vault policy write "${VAULT_ROLE_ADMIN}" - <<EOF
              path "${DB_MOUNT}/creds/${VAULT_ROLE_ADMIN}" { capabilities = ["read"] }
              EOF
              vault policy write "${VAULT_ROLE_APP}" - <<EOF
              path "${DB_MOUNT}/creds/${VAULT_ROLE_APP}" { capabilities = ["read"] }
              EOF

              # Kubernetes auth roles
              vault write auth/${AUTH_PATH}/role/${VAULT_ROLE_RO} \
                bound_service_account_names="${SA_RO}" \
                bound_service_account_namespaces="${SA_NS}" \
                policies="${VAULT_ROLE_RO}" \
                ttl="24h"

              vault write auth/${AUTH_PATH}/role/${VAULT_ROLE_ADMIN} \
                bound_service_account_names="${SA_ADMIN}" \
                bound_service_account_namespaces="${SA_NS}" \
                policies="${VAULT_ROLE_ADMIN}" \
                ttl="24h"

              # Unified app role bound to both SAs
              vault write auth/${AUTH_PATH}/role/${VAULT_ROLE_APP} \
                bound_service_account_names="${SA_RO},${SA_ADMIN}" \
                bound_service_account_namespaces="${SA_NS}" \
                policies="${VAULT_ROLE_APP}" \
                ttl="24h"

              echo "🎉 Vault DB engine, roles, policies, and k8s auth roles ready."
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
---
# =================================================================
# === OpenAPI bridge (stdio sidecar) — READ-ONLY INSTANCE (uses full RW DB via app role)
# =================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-openapi-ro
  namespace: k8s-mcp-service
  labels: { app: mcp-openapi-ro }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-openapi-ro }
  template:
    metadata:
      labels: { app: mcp-openapi-ro }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "mcp-yb-app"
        vault.hashicorp.com/auth-path: "auth/kubernetes"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-yb-username: "yugabyte-db/creds/mcp-yb-app"
        vault.hashicorp.com/agent-inject-template-yb-username: |
          {{- with secret "yugabyte-db/creds/mcp-yb-app" -}}{{ .Data.username }}{{- end }}
        vault.hashicorp.com/agent-inject-secret-yb-password: "yugabyte-db/creds/mcp-yb-app"
        vault.hashicorp.com/agent-inject-template-yb-password: |
          {{- with secret "yugabyte-db/creds/mcp-yb-app" -}}{{ .Data.password }}{{- end }}
        vault.hashicorp.com/secret-volume-path: "/vault/secrets"
    spec:
      serviceAccountName: mcp-server-ro
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      volumes:
        - name: kube
          emptyDir: {}
        - name: mcpbin
          emptyDir: {}
        - name: driver-config
          configMap:
            name: mcp-openapi-ro-driver-config
            items:
              - key: driver-manifest.yaml
                path: driver-manifest.yaml
      initContainers:
        - name: write-kubeconfig
          image: alpine:3.20
          securityContext: { runAsUser: 0, runAsNonRoot: false }
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              cat > /kube/config <<EOF
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  server: ${API}
                name: in
              contexts:
              - context:
                  cluster: in
                  namespace: ${NS}
                  user: sa
                name: in
              current-context: in
              users:
              - name: sa
                user:
                  token: ${TOKEN}
              EOF
          volumeMounts:
            - name: kube
              mountPath: /kube
        - name: fetch-mcp-binary
          image: ghcr.io/azure/mcp-kubernetes:latest
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              for p in /usr/local/bin/mcp-kubernetes /app/mcp-kubernetes /mcp-kubernetes; do
                if [ -x "$p" ]; then cp "$p" /mcpbin/mcp-kubernetes && chmod +x /mcpbin/mcp-kubernetes && exit 0; fi
              done
              echo "mcp-kubernetes binary not found in image" >&2; exit 1
          volumeMounts:
            - name: mcpbin
              mountPath: /mcpbin
        - name: install-kubectl
          image: bitnami/kubectl:1.29
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              SRC="/opt/bitnami/kubectl/bin/kubectl"
              if [ -x "$SRC" ]; then
                cp "$SRC" /mcpbin/kubectl && chmod +x /mcpbin/kubectl
              elif command -v kubectl >/dev/null 2>&1; then
                cp "$(command -v kubectl)" /mcpbin/kubectl && chmod +x /mcpbin/kubectl
              else
                echo "kubectl not found in bitnami image" >&2; exit 1
              fi
          volumeMounts:
            - name: mcpbin
              mountPath: /mcpbin
      containers:
        - name: bridge
          image: ghcr.io/dotcomrow/mcp-openapi-tool-server-image:ts-20250915-144748
          imagePullPolicy: Always
          env:
            - name: PATH
              value: "/mcpbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            - name: MCP_STDIO_ENABLED
              value: "1"
            - name: MCP_FORCE_STDIO
              value: "1"
            - name: MCP_STDIO_INIT_TIMEOUT
              value: "45"
            - name: MCP_STDIO_PREFLIGHT
              value: "1"
            - name: MCP_STDIO_EXTRA_ARGS
              value: ""
            - name: MCP_SERVERS
              value: |
                [
                  {
                    "alias": "mcp",
                    "mode": "stdio",
                    "cmd": ["/mcpbin/mcp-kubernetes", "--transport", "stdio", "--access-level", "readonly"],
                    "env": { "KUBECONFIG": "/kube/config" }
                  }
                ]
            - name: MCP_DRIVER_MODULES
              value: "mcp_openapi.drivers.yugabyte_driver"
            - name: DRIVER_MANIFEST_PATH
              value: "/etc/mcp/driver-manifest.yaml"
            - name: DRIVER_CACHE_TTL_SECONDS
              value: "60"
            - name: DRIVER_CACHE_MAX_WAIT_SECONDS
              value: "10"
            - name: CORS_ALLOW_ORIGINS
              value: "*"
            - name: STARTUP_TIMEOUT
              value: "30"
            - name: RUN_MIGRATIONS
              value: "1"
            - name: DB_HOST
              value: "yb-tserver-service.yugabyte.svc.cluster.local"
            - name: DB_PORT
              value: "5433"
            - name: DB_NAME
              value: "mcp"
            - name: DB_SCHEMA
              value: "mcp_openapi_ro"
            - name: DB_SSLMODE
              value: "disable"
            - name: DB_USER_FILE
              value: "/vault/secrets/yb-username"
            - name: DB_PASS_FILE
              value: "/vault/secrets/yb-password"
            - name: DB_MIGRATIONS_DIR
              value: "/app/migrations"
            - name: DB_SEEDS_DIR
              value: "/app/seeds"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - name: kube
              mountPath: /kube
            - name: mcpbin
              mountPath: /mcpbin
            - name: driver-config
              mountPath: /etc/mcp
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-openapi-ro
  namespace: k8s-mcp-service
  labels: { app: mcp-openapi-ro }
spec:
  type: ClusterIP
  selector: { app: mcp-openapi-ro }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# =================================================================
# === OpenAPI bridge (stdio sidecar) — ADMIN INSTANCE (uses full RW DB via app role)
# =================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-openapi-admin
  namespace: k8s-mcp-service
  labels: { app: mcp-openapi-admin }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-openapi-admin }
  template:
    metadata:
      labels: { app: mcp-openapi-admin }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "mcp-yb-app"
        vault.hashicorp.com/auth-path: "auth/kubernetes"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-yb-username: "yugabyte-db/creds/mcp-yb-app"
        vault.hashicorp.com/agent-inject-template-yb-username: |
          {{- with secret "yugabyte-db/creds/mcp-yb-app" -}}{{ .Data.username }}{{- end }}
        vault.hashicorp.com/agent-inject-secret-yb-password: "yugabyte-db/creds/mcp-yb-app"
        vault.hashicorp.com/agent-inject-template-yb-password: |
          {{- with secret "yugabyte-db/creds/mcp-yb-app" -}}{{ .Data.password }}{{- end }}
        vault.hashicorp.com/secret-volume-path: "/vault/secrets"
    spec:
      serviceAccountName: mcp-server-admin
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      volumes:
        - name: kube
          emptyDir: {}
        - name: mcpbin
          emptyDir: {}
        - name: driver-config
          configMap:
            name: mcp-openapi-admin-driver-config
            items:
              - key: driver-manifest.yaml
                path: driver-manifest.yaml
      initContainers:
        - name: write-kubeconfig
          image: alpine:3.20
          securityContext: { runAsUser: 0, runAsNonRoot: false }
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              cat > /kube/config <<EOF
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  server: ${API}
                name: in
              contexts:
              - context:
                  cluster: in
                  namespace: ${NS}
                  user: sa
                name: in
              current-context: in
              users:
              - name: sa
                user:
                  token: ${TOKEN}
              EOF
          volumeMounts:
            - name: kube
              mountPath: /kube
        - name: fetch-mcp-binary
          image: ghcr.io/azure/mcp-kubernetes:latest
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              for p in /usr/local/bin/mcp-kubernetes /app/mcp-kubernetes /mcp-kubernetes; do
                if [ -x "$p" ]; then cp "$p" /mcpbin/mcp-kubernetes && chmod +x /mcpbin/mcp-kubernetes && exit 0; fi
              done
              echo "mcp-kubernetes binary not found in image" >&2; exit 1
          volumeMounts:
            - name: mcpbin
              mountPath: /mcpbin
        - name: install-kubectl
          image: bitnami/kubectl:1.29
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              SRC="/opt/bitnami/kubectl/bin/kubectl"
              if [ -x "$SRC" ]; then
                cp "$SRC" /mcpbin/kubectl && chmod +x /mcpbin/kubectl
              elif command -v kubectl >/dev/null 2>&1; then
                cp "$(command -v kubectl)" /mcpbin/kubectl && chmod +x /mcpbin/kubectl
              else
                echo "kubectl not found in bitnami image" >&2; exit 1
              fi
          volumeMounts:
            - name: mcpbin
              mountPath: /mcpbin
      containers:
        - name: bridge
          image: ghcr.io/dotcomrow/mcp-openapi-tool-server-image:ts-20250915-144748
          imagePullPolicy: Always
          env:
            - name: PATH
              value: "/mcpbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            - name: MCP_STDIO_ENABLED
              value: "1"
            - name: MCP_FORCE_STDIO
              value: "1"
            - name: MCP_STDIO_INIT_TIMEOUT
              value: "45"
            - name: MCP_STDIO_PREFLIGHT
              value: "1"
            - name: MCP_STDIO_EXTRA_ARGS
              value: ""
            - name: MCP_SERVERS
              value: |
                [
                  {
                    "alias": "mcp",
                    "mode": "stdio",
                    "cmd": ["/mcpbin/mcp-kubernetes", "--transport", "stdio", "--access-level", "admin"],
                    "env": { "KUBECONFIG": "/kube/config" }
                  }
                ]
            - name: MCP_DRIVER_MODULES
              value: "mcp_openapi.drivers.yugabyte_driver"
            - name: DRIVER_MANIFEST_PATH
              value: "/etc/mcp/driver-manifest.yaml"
            - name: DRIVER_CACHE_TTL_SECONDS
              value: "60"
            - name: DRIVER_CACHE_MAX_WAIT_SECONDS
              value: "10"
            - name: CORS_ALLOW_ORIGINS
              value: "*"
            - name: STARTUP_TIMEOUT
              value: "30"
            - name: RUN_MIGRATIONS
              value: "1"
            - name: DB_HOST
              value: "yb-tserver-service.yugabyte.svc.cluster.local"
            - name: DB_PORT
              value: "5433"
            - name: DB_NAME
              value: "mcp"
            - name: DB_SCHEMA
              value: "mcp_openapi_admin"
            - name: DB_SSLMODE
              value: "disable"
            - name: DB_USER_FILE
              value: "/vault/secrets/yb-username"
            - name: DB_PASS_FILE
              value: "/vault/secrets/yb-password"
            - name: DB_MIGRATIONS_DIR
              value: "/app/migrations"
            - name: DB_SEEDS_DIR
              value: "/app/seeds"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - name: kube
              mountPath: /kube
            - name: mcpbin
              mountPath: /mcpbin
            - name: driver-config
              mountPath: /etc/mcp
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-openapi-admin
  namespace: k8s-mcp-service
  labels: { app: mcp-openapi-admin }
spec:
  type: ClusterIP
  selector: { app: mcp-openapi-admin }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# ======================
# NetworkPolicy — OpenWebUI (ingress)
# ======================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-openapi-allow-openwebui
  namespace: k8s-mcp-service
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["mcp-openapi-ro","mcp-openapi-admin"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ollama
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8080
