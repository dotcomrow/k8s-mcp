            - name: MCP_STDIO_EXTRA_ARGS
              value: ""
            - name: MCP_SERVERS
              value: |
                [
                  {
                    "alias": "mcp",
                    "mode": "stdio",
                    "cmd": ["/mcpbin/mcp-kubernetes", "--transport", "stdio"],
                    "env": { "KUBECONFIG": "/kube/config" }
                  }
                ]
            - name: MCP_DRIVER_MODULES
              value: "mcp_openapi.drivers.yugabyte_driver"
            - name: DRIVER_MANIFEST_PATH
              value: "/etc/mcp/driver-manifest.yaml"
            - name: DRIVER_CACHE_TTL_SECONDS
              value: "60"
            - name: DRIVER_CACHE_MAX_WAIT_SECONDS
              value: "10"
            - name: CORS_ALLOW_ORIGINS
              value: "*"
            - name: STARTUP_TIMEOUT
              value: "30"
            - name: RUN_MIGRATIONS
              value: "1"
            - name: DB_HOST
              value: "yb-tserver-service.yugabyte.svc.cluster.local"
            - name: DB_PORT
              value: "5433"
            - name: DB_NAME
              value: "mcp"
            - name: DB_SCHEMA
              value: "mcp_openapi_ro"
            - name: DB_SSLMODE
              value: "disable"
            - name: DB_USER_FILE
              value: "/vault/secrets/yb-username"
            - name: DB_PASS_FILE
              value: "/vault/secrets/yb-password"
            - name: DB_MIGRATIONS_DIR
              value: "/app/migrations"
            - name: DB_SEEDS_DIR
              value: "/app/seeds"
